# Channel metadata for feed.xml and the website.
title: HCI Deep Dives
site_url: https://www.deep-hci.org
feed_path: /feed.xml
description: >-
  Each episode works through one recent HCI paper in about fifteen minutes: what the
  authors built, how they evaluated it, and what the results do and don't support.
  Topics span wearable computing, haptics, augmented perception, and affective
  computing. The conversations are AI-generated from the papers themselves, and every
  episode links the original work and its DOI.
author: Kai Kunze
owner_name: Kai Kunze
owner_email: ""  # optional; the Podbean feed had none
language: en
copyright: Copyright 2024 All rights reserved.
categories: [Science, Education]
explicit: false
image: img/logo.jpg

# Two repos: the site (this one) and the audio, whose yearly releases
# (audio-<year>) hold the episode files.
site_repo: geist-publishing/deep-hci
audio_repo: geist-publishing/deep-hci-audio

