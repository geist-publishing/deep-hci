description: >-
  HCI Deep Dives is your go-to podcast for exploring the latest trends, research,
  and innovations in Human Computer Interaction (HCI). AI-generated using the latest
  publications in the field, each episode dives into in-depth discussions on topics
  like wearable computing, augmented perception, cognitive augmentation, and
  digitalized emotions. Whether you're a researcher, practitioner, or just curious
  about the intersection of technology and human senses, this podcast offers
  thought-provoking insights and ideas to keep you at the forefront of HCI.
