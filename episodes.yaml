- guid: deep-hci.org/d57beb10-bfad-44ad-8988-2c88aada6df0
  title: 'IEEE VR 2025 Cognitive Load: Cognitive Load Inference Using Physiological Markers in Virtual
    Reality'
  slug: ieee-vr-2025-cognitive-load-cognitive-load-inference-using-physiological-markers-in-virtua
  published: '2026-02-02T23:00:00+00:00'
  episode: 74
  duration: 791
  audio_file: Predicting_VR_Cognitive_Load_in_Real_Time.m4a
  audio_length: 25487053
  audio_type: audio/x-m4a
  image: 9b40f6267fb4ad09bfce0c930e68641055a499a0a7170b696b8a969f48019768.jpg
  description: |-
    <p>How hard is your brain working in VR? This paper presents a machine learning system that predicts cognitive load in real time using behavioral and physiological signals collected through VR headsets. Trained on data from 738 participants across various VR experiences, the model achieves remarkably low error (MAE of 0.11) in predicting mental workload. The system analyzes markers like eye movements, head motion, and physiological responses to infer how cognitively demanding a VR experience is for users. This has significant implications for adaptive VR systems that could automatically adjust difficulty, pacing, or complexity based on the user's mental state. The researchers also release a test dataset from 100 participants to enable further research in this area.</p>

    <p>Jishang Wei, Erika Siegel, Prahalathan Sundaramoorthy, Antônio Gomes, Shibo Zhang, Mithra Vankipuram, Kevin Smathers, Sarthak Ghosh, Hiroshi Horii, Jeremy Bailenson, and Rafael Ballagas. 2025. Cognitive Load Inference Using Physiological Markers in Virtual Reality. In 2025 IEEE Conference Virtual Reality and 3D User Interfaces (VR), Saint Malo, France. IEEE. <a href="https://doi.org/10.1109/VR59515.2025.00098">https://doi.org/10.1109/VR59515.2025.00098</a></p>
