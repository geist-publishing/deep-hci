  image: episode18_cvdb5j.jpg
  description: |-
    <p>Junlei Hong, Tobias Langlotz, Jonathan Sutton, and Holger Regenbrecht. 2024. Visual Noise Cancellation: Exploring Visual Discomfort and Opportunities for Vision Augmentations. ACM Trans. Comput.-Hum. Interact. 31, 2, Article 22 (April 2024), 26 pages. <a href='https://doi.org/10.1145/3634699'>https://doi.org/10.1145/3634699</a></p>
    <p>Acoustic noise control or cancellation (ANC) is a commonplace component of modern audio headphones. ANC aims to actively mitigate disturbing environmental noise for a quieter and improved listening experience. ANC is digitally controlling frequency and amplitude characteristics of sound. Much less explored is visual noise and active visual noise control, which we address here. We first explore visual noise and scenarios in which visual noise arises based on findings from four workshops we conducted. We then introduce the concept of visual noise cancellation (VNC) and how it can be used to reduce identified effects of visual noise. In addition, we developed head-worn demonstration prototypes to practically explore the concept of active VNC with selected scenarios in a user study. Finally, we discuss the application of VNC, including vision augmentations that moderate the user’s view of the environment to address perceptual needs and to provide augmented reality content.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3634699'>https://dl.acm.org/doi/10.1145/3634699</a></p>
- guid: deephci.podbean.com/40b362dd-6523-3157-a20c-82a800a8f2e1
  title: 'MobileHCI 2024: Shock Me The Way: Directional Electrotactile Feedback under the Smartwatch as
    a Navigation Aid for Cyclists'
  slug: mobilehci-2024-shock-me-the-way-directional-electrotactile-feedback-under-the-smartwatch-as-a-navigation-aid-for-cyclists
  published: '2024-10-21T20:54:09+09:00'
  episode: 21
  duration: 727
  audio_file: 10-1145-3676521.mp3
  audio_length: 2911820
  audio_type: audio/mpeg
  image: episode23_q7wydp.jpg
  description: |-
    <p>Tim Duente, Dennis Stanke, Moritz Klose, Benjamin Simon, Ibraheem Al-Azzawi, and Michael Rohs. 2024. Shock Me The Way: Directional Electrotactile Feedback under the Smartwatch as a Navigation Aid for Cyclists. Proc. ACM Hum.-Comput. Interact. 8, MHCI, Article 274 (September 2024), 25 pages. <a href='https://doi.org/10.1145/3676521'>https://doi.org/10.1145/3676521</a></p>
    <p>Cycling navigation is a complex and stressful task as the cyclist needs to focus simultaneously on the navigation, the road, and other road users. We propose directional electrotactile feedback at the wrist to reduce the auditory and visual load during navigation-aided cycling. We designed a custom electrotactile grid with 9 electrodes that is clipped under a smartwatch. In a preliminary study we identified suitable calibration settings and gained first insights about a suitable electrode layout. In a subsequent laboratory study we showed that a direction can be encoded with a mean error of 19.28\,° (σ = 42.77°) by combining 2 adjacent electrodes. Additionally, by interpolating with 3 electrodes a direction can be conveyed with a similar mean error of 22.54° (σ = 43.57°). We evaluated our concept of directional electrotactile feedback for cyclists in an outdoor study, in which 98.8% of all junctions were taken correctly by eight study participants. Only one participant deviated substantially from the optimal path, but was successfully navigated back to the original route by our system.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3676521'>https://dl.acm.org/doi/10.1145/3676521</a></p>
    <p> </p>
- guid: deephci.podbean.com/d63b10e8-46c9-3cfd-851f-e473e52194f5
  title: 'MobileHCI 2024: An Examination of Ultrasound Mid-air Haptics for Enhanced Material and Temperature
    Perception in Virtual Environments'
  slug: mobilehci-2024-an-examination-of-ultrasound-mid-air-haptics-for-enhanced-material-and-temperature-perception-in-virtual-environments
  published: '2024-10-20T21:16:07+09:00'
  episode: 20
  duration: 572
  audio_file: 10-1145-3676488.mp3
  audio_length: 2290892
  audio_type: audio/mpeg
  image: episode22_egb5hh.jpg
  description: |-
    <p>Steeven Villa, Yannick Weiss, Niklas Hirsch, and Alexander Wiethoff. 2024. An Examination of Ultrasound Mid-air Haptics for Enhanced Material and Temperature Perception in Virtual Environments. Proc. ACM Hum.-Comput. Interact. 8, MHCI, Article 243 (September 2024), 21 pages. https://doi.org/10.1145/3676488</p>
    <p>Rendering realistic tactile sensations of virtual objects remains a challenge in VR. While haptic interfaces have advanced, particularly with phased arrays, their ability to create realistic object properties like state and temperature remains unclear. This study investigates the potential of Ultrasound Mid-air Haptics (UMH) for enhancing the perceived congruency of virtual objects. In a user study with 30 participants, we assessed how UMH impacts the perceived material state and temperature of virtual objects. We also analyzed EEG data to understand how participants integrate UMH information physiologically. Our results reveal that UMH significantly enhances the perceived congruency of virtual objects, particularly for solid objects, reducing the feeling of mismatch between visual and tactile feedback. Additionally, UMH consistently increases the perceived temperature of virtual objects. These findings offer valuable insights for haptic designers, demonstrating UMH's potential for creating more immersive tactile experiences in VR by addressing key limitations in current haptic technologies.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3676488'>https://dl.acm.org/doi/10.1145/3676488</a></p>
- guid: deephci.podbean.com/9b66b222-811c-3029-8adf-543ca0db1732
  title: Linking Audience Physiology to Choreography
  slug: linking-audience-physiology-to-choreography-1729425720
  published: '2024-10-20T21:02:00+09:00'
  episode: 19
  duration: 640
  audio_file: han2022linking-2.mp3
  audio_length: 2562860
  audio_type: audio/mpeg
  image: episode21_fq9fia.jpg
  description: |-
    <p>The use of wearable sensor technology opens up exciting avenues for both art and HCI research, providing new ways to explore the invisible link between audience and performer. To be effective, such work requires close collaboration between performers and researchers. In this article, we report on the co-design process and research insights from our work integrating physiological sensing and live performance. We explore the connection between the audience’s physiological data and their experience during the performance, analyzing a multi-modal dataset collected from 98 audience members. We identify notable moments based on HRV and EDA, and show how the audience’s physiological responses can be linked to the choreography. The longitudinal changes in HRV features suggest a strong connection to the choreographer’s intended narrative arc, while EDA features appear to correspond with short-term audience responses to dramatic moments. We discuss the physiological phenomena and implications for designing feedback systems and interdisciplinary collaborations.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3557887'>https://dl.acm.org/doi/10.1145/3557887</a></p>
- guid: deephci.podbean.com/39c39950-4c1f-3b9c-8727-09a363e72866
  title: 'MobileHCI 2024: Head ’n Shoulder: Gesture-Driven Biking Through Capacitive Sensing Garments
    to Innovate Hands-Free Interaction'
  slug: mobilehci-2024-head-n-shoulder-gesture-driven-biking-through-capacitive-sensing-garments-to-innovate-hands-free-interaction
  published: '2024-10-20T18:36:44+09:00'
  episode: 18
  duration: 573
  audio_file: 10-1145-3676510.mp3
  audio_length: 2292428
  audio_type: audio/mpeg
  image: episode19_copy_asc627.jpeg
  description: |-
    <p>Daniel Geißler, Hymalai Bello, Esther Zahn, Emil Woop, Bo Zhou, Paul Lukowicz, and Jakob Karolus. 2024. Head 'n Shoulder: Gesture-Driven Biking Through Capacitive Sensing Garments to Innovate Hands-Free Interaction. Proc. ACM Hum.-Comput. Interact. 8, MHCI, Article 265 (September 2024), 20 pages. https://doi.org/10.1145/3676510</p>
    <p>Distractions caused by digital devices are increasingly causing dangerous situations on the road, particularly for more vulnerable road users like cyclists. While researchers have been exploring ways to enable richer interaction scenarios on the bike, safety concerns are frequently neglected and compromised. In this work, we propose Head 'n Shoulder, a gesture-driven approach to bike interaction without affecting bike control, based on a wearable garment that allows hands- and eyes-free interaction with digital devices through integrated capacitive sensors. It achieves an average accuracy of 97% in the final iteration, evaluated on 14 participants. Head 'n Shoulder does not rely on direct pressure sensing, allowing users to wear their everyday garments on top or underneath, not affecting recognition accuracy. Our work introduces a promising research direction: easily deployable smart garments with a minimal set of gestures suited for most bike interaction scenarios, sustaining the rider's comfort and safety.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3676510'>https://dl.acm.org/doi/10.1145/3676510</a></p>
- guid: deephci.podbean.com/42d5b91e-fd23-3395-874a-b79813f79243
  title: 'ISWC 2024 Best Paper Award: Integrating Force Sensing with Electro-Tactile Feedback in 3D Printed
    Haptic Interfaces'
  slug: iswc-2024-best-paper-award-integrating-force-sensing-with-electro-tactile-feedback-in-3d-printed-haptic-interfaces
  published: '2024-10-13T20:56:00+09:00'
  episode: 16
  duration: 546
  audio_file: 10-1145-3675095-3676612.mp3
  audio_length: 2186252
  audio_type: audio/mpeg
  image: episode17_bae2jb.jpg
  description: |-
    <p>We deep dive today into the ISWC 2024 best paper award.</p>
    <p> </p>
    <p>Tactile feedback mechanisms enhance the user experience of modern wearables by stimulating the sense of touch and enabling intuitive interactions. Electro-tactile stimulation-based tactile interfaces stand out due to their compact form factor and ability to deliver localized tactile sensations. Integrating force sensing with electro-tactile stimulation creates more responsive bidirectional systems that are beneficial in applications requiring precise control and feedback. However, current research often relies on separate sensors for force sensing, increasing system complexity and raising challenges in system scalability. We propose a novel approach that utilizes 3D-printed modified surfaces as the electro-tactile electrode interface to sense applied force and deliver feedback simultaneously without additional sensors. This method simplifies the system, maintains flexibility, and leverages the rapid prototyping capabilities of 3D printing. The functionality of this approach is validated through a user study (N=10), and two practical applications are proposed, both incorporating simultaneous sensing and tactile feedback.</p>
    <p>https://dl.acm.org/doi/10.1145/3675095.3676612</p>
- guid: deephci.podbean.com/54416f58-0737-3ca2-ab70-b25931299edc
  title: 'ISWC 2024 Honorable Mention: EchoGuide: Active Acoustic Guidance for LLM-Based Eating Event
    Analysis from Egocentric Videos'
  slug: iswc-2024-honorable-mention-echoguide-active-acoustic-guidance-for-llm-based-eating-event-analysis-from-egocentric-videos
  published: '2024-10-13T17:53:13+09:00'
  episode: 15
  duration: 768
  audio_file: 10-1145-3675095-3676611.mp3
  audio_length: 3073868
  audio_type: audio/mpeg
  image: episode16_vu4nzm.jpg
  description: |-
    <p>We deep dive today into an ISWC 2024 Honorable Mention.</p>
    <p>Self-recording eating behaviors is a step towards a healthy lifestyle recommended by many health professionals. However, the current practice of manually recording eating activities using paper records or smartphone apps is often unsustainable and inaccurate. Smart glasses have emerged as a promising wearable form factor for tracking eating behaviors, but existing systems primarily identify when eating occurs without capturing details of the eating activities (E.g., what is being eaten). In this paper, we present EchoGuide, an application and system pipeline that leverages low-power active acoustic sensing to guide head-mounted cameras to capture egocentric videos, enabling efficient and detailed analysis of eating activities. By combining active acoustic sensing for eating detection with video captioning models and large-scale language models for retrieval augmentation, EchoGuide intelligently clips and analyzes videos to create concise, relevant activity records on eating. We evaluated EchoGuide with 9 participants in naturalistic settings involving eating activities, demonstrating high-quality summarization and significant reductions in video data needed, paving the way for practical, scalable eating activity tracking.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3675095.3676611'>https://dl.acm.org/doi/10.1145/3675095.3676611</a></p>
    <p> </p>
- guid: deephci.podbean.com/ebde41b1-5f4b-36aa-8e19-d043fd8df1dd
  title: 'ISWC 2024 Honorable Mention: RetailOpt: Opt-In, Easy-to-Deploy Trajectory Estimation from Smartphone
    Motion Data and Retail Facility Information'
  slug: iswc-2024-honorable-mention-retailopt-opt-in-easy-to-deploy-trajectory-estimation-from-smartphone-motion-data-and-retail-facility-information
  published: '2024-10-13T14:45:00+09:00'
  episode: 14
  duration: 503
  audio_file: 10-1145-3675095-3676623.mp3
  audio_length: 2014412
  audio_type: audio/mpeg
  image: episode15_gwxm7t.jpg
  description: |-
    <p>We deep dive today into an ISWC 2024 Honorable Mention.</p>
    <p>We present RetailOpt, a novel opt-in, easy-to-deploy system for tracking customer movements offline in indoor retail environments. The system uses readily accessible information from customer smartphones and retail apps, including motion data, store maps, and purchase records. This eliminates the need for additional hardware installations/maintenance and ensures customers full data control. Specifically, RetailOpt first uses inertial navigation to recover relative trajectories from smartphone motion data. The store map and purchase records are cross-referenced to identify a list of visited shelves, providing anchors to localize the relative trajectories in a store through continuous and discrete optimization. We demonstrate the effectiveness of our system in five diverse environments. The system, if successful, would produce accurate customer movement data, essential for a broad range of retail applications including customer behavior analysis and in-store navigation.</p>
    <p>https://dl.acm.org/doi/pdf/10.1145/3675095.3676623</p>
- guid: deephci.podbean.com/2a25d57c-4d3b-3ae2-8b7c-9707b0223c32
  title: 'UbiComp 2024 Distinguished Paper Award: SkinLink: On-body Construction and Prototyping of Reconfigurable
    Epidermal Interfaces'
  slug: ubicomp-2024-distinguished-paper-award-skinlink-on-body-construction-and-prototyping-of-reconfigurable-epidermal-interfaces
  published: '2024-10-12T21:13:18+09:00'
  episode: 13
  duration: 787
  audio_file: 10-1145-3596241.mp3
  audio_length: 3148268
  audio_type: audio/mpeg
  image: episode14_kubseb.jpg
  description: |-
    <p>Today we deep dive into one publication that received a UbiComp 2024 distinguished paper awards.</p>
    <p>Applying customized epidermal electronics closely onto the human skin offers the potential for biometric sensing and unique, always-available on-skin interactions. However, iterating designs of an on-skin interface from schematics to physical circuit wiring can be time-consuming, even with tiny modifications; it is also challenging to preserve skin wearability after repeated alteration. We present SkinLink, a reconfigurable on-skin fabrication approach that allows users to intuitively explore and experiment with the circuitry adjustment on the body. We demonstrate SkinLink with a customized on-skin prototyping toolkit comprising tiny distributed circuit modules and a variety of streamlined trace modules that adapt to diverse body surfaces. To evaluate SkinLink's performance, we conducted a 14-participant usability study to compare and contrast the workflows with a benchmark on-skin construction toolkit. Four case studies targeting a film makeup artist, two beauty makeup artists, and a wearable computing designer further demonstrate different application scenarios and usages.</p>
    <p>https://dl.acm.org/doi/10.1145/3596241</p>
- guid: deephci.podbean.com/d6d431c0-0b0f-3013-b937-78a7aa4e6a38
  title: 'UbiComp 2024 Distinguished Paper Award: MoCaPose: Motion Capturing with Textile-integrated Capacitive
    Sensors in Loose-fitting Smart Garments'
  slug: ubicomp-2024-distinguished-paper-award-mocapose-motion-capturing-with-textile-integrated-capacitive-sensors-in-loose-fitting-smart-garments
  published: '2024-10-12T20:53:00+09:00'
  episode: 12
  duration: 496
  audio_file: 10-1145-3580883.mp3
  audio_length: 1984268
  audio_type: audio/mpeg
  image: episode13_z3rdrf.jpg
  description: |-
    <p>Today we deep dive into one publication that received a UbiComp 2024 distinguished paper awards.</p>
    <p>We present MoCaPose, a novel wearable motion capturing (MoCap) approach to continuously track the wearer's upper body's dynamic poses through multi-channel capacitive sensing integrated in fashionable, loose-fitting jackets. Unlike conventional wearable IMU MoCap based on inverse dynamics, MoCaPose decouples the sensor position from the pose system. MoCaPose uses a deep regressor to continuously predict the 3D upper body joints coordinates from 16-channel textile capacitive sensors, unbound by specific applications. The concept is implemented through two prototyping iterations to first solve the technical challenges, then establish the textile integration through fashion-technology co-design towards a design-centric smart garment. A 38-hour dataset of synchronized video and capacitive data from 21 participants was recorded for validation. The motion tracking result was validated on multiple levels from statistics (R2 ~ 0.91) and motion tracking metrics (MP JPE ~ 86mm) to the usability in pose and motion recognition (0.9 F1 for 10-class classification with unsupervised class discovery). The design guidelines impose few technical constraints, allowing the wearable system to be design-centric and usecase-specific. Overall, MoCaPose demonstrates that textile-based capacitive sensing with its unique advantages, can be a promising alternative for wearable motion tracking and other relevant wearable motion recognition applications.</p>
    <p>https://dl.acm.org/doi/10.1145/3580883</p>
- guid: deephci.podbean.com/9c84dcb5-5d8a-3285-a6d0-66f066bad23d
  title: 'atmoSphere: designing cross-modal music experiences using spatial audio with haptic feedback'
  slug: atmosphere-designing-cross-modal-music-experiences-using-spatial-audio-with-haptic-feedback
  published: '2024-10-11T16:45:37+09:00'
  episode: 11
  duration: 355
  audio_file: fushimi2017atmosphere.mp3
  audio_length: 1421900
  audio_type: audio/mpeg
  image: episode12_i3fjn7.jpg
  description: |-
    <p>We use cross-Modal correspondence -the interaction between two or more sensory modalities- to create an engaging user experience. We present atmoSphere, a system that provides users immersive music experiences using spatial audio and haptic feedback. We focused on cross-modality of auditory and haptic sensations to augment the sound environment. The atmoSphere consists of a spatialized music and a sphere shaped device which provides haptic feedback. It provides users imagination of large sound environment although they feel haptic sensation in their hands. First user feedback is very encouraging. According to participants, atmoSphere creates an engaging experience.</p>
    <p>https://dl.acm.org/doi/10.1145/3084822.3084845</p>
- guid: deephci.podbean.com/0ff44e08-e382-3797-becb-05e6fcb4e48a
  title: 'Armswing: using arm swings for accessible and immersive navigation in AR/VR spaces'
  slug: armswing-using-arm-swings-for-accessible-and-immersive-navigation-in-arvr-spaces
  published: '2024-10-11T16:40:12+09:00'
  episode: 10
  duration: 459
  audio_file: pai2017armswing.mp3
  audio_length: 1837100
  audio_type: audio/mpeg
  image: episode11_8zq62i.jpg
  description: |-
    <p>Navigating in a natural way in augmented reality (AR) and virtual reality (VR) spaces is a large challenge. To this end, we present ArmSwingVR, a locomotion solution for AR/VR spaces that preserves immersion, while being low profile compared to current solutions, particularly walking-in-place (WIP) methods. The user simply needs to swing their arms naturally to navigate in the direction where the arms are swung, without any feet or head movement. The benefits of ArmSwingVR are that arm swinging feels natural for bipedal organisms second only to leg movement, no additional peripherals or sensors are required, it is less obtrusive to swing our arms as opposed to WIP methods, and requires less energy allowing prolong uses for AR/VR. A conducted user study found that our method does not sacrifice immersion while also being more low profile and less energy consumption compared to WIP.</p>
    <p>https://dl.acm.org/doi/10.1145/3152832.3152864</p>
- guid: deephci.podbean.com/597a3d98-97fe-35f1-a926-f497aee156d4
  title: Shape memory alloy wire actuators for soft, wearable haptic devices
  slug: shape-memory-alloy-wire-actuators-for-soft-wearable-haptic-devices
  published: '2024-10-11T14:15:13+09:00'
  episode: 9
  duration: 376
  audio_file: fu2021boiling.mp3
  audio_length: 1505612
  audio_type: audio/mpeg
  image: episode10_kew833.jpg
  description: |-
    <p>This paper presents a new approach to implement wearable haptic devices using Shape Memory Alloy (SMA) wires. The proposed concept allows building silent, soft, flexible and lightweight wearable devices, capable of producing the sense of pressure on the skin without any bulky mechanical actuators. We explore possible design considerations and applications for such devices, present user studies proving the feasibility of delivering meaningful information and use nonlinear autoregressive neural networks to compensate for SMA inherent drawbacks, such as delayed onset, enabling us to characterize and predict the physical behavior of the device.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3267242.3267257'>https://dl.acm.org/doi/10.1145/3267242.3267257</a></p>
- guid: deephci.podbean.com/25422595-2c07-388a-b7b8-4830e5117101
  title: 'Seeing our Blind Spots: Smart Glasses-based Simulation to Increase Design Students’ Awareness
    of Visual Impairment'
  slug: seeing-our-blind-spots-smart-glasses-based-simulation-to-increase-design-students-awareness-of-visual-impairment
  published: '2024-10-06T18:32:04+09:00'
  episode: 8
  duration: 419
  audio_file: zhang2022seeing.mp3
  audio_length: 1676300
  audio_type: audio/mpeg
  image: episode9_fphdtz.jpg
  description: |-
    <p>As the population ages, many will acquire visual impairments. To improve design for these users, it is essential to build awareness of their perspective during everyday routines, especially for design students.<br>
    Although several visual impairment simulation toolkits exist in both academia and as commercial products, analog, and static visual impairment simulation tools do not simulate effects concerning the user’s eye movements. Meanwhile, VR and video see-through-based AR simulation methods are constrained by smaller fields of view when compared with the natural human visual field and also suffer from vergence-accommodation conflict (VAC) which correlates with visual fatigue, headache, and dizziness.<br>
    In this paper, we enable an on-the-go, VAC-free, visually impaired experience by leveraging our optical see-through glasses. The FOV of our glasses is approximately 160 degrees for horizontal and 140 degrees for vertical, and participants can experience both losses of central vision and loss of peripheral vision at different severities. Our evaluation (n =14) indicates that the glasses can significantly and effectively reduce visual acuity and visual field without causing typical motion sickness symptoms such as headaches and or visual fatigue. Questionnaires and qualitative feedback also showed how the glasses helped to increase participants’ awareness of visual impairment.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3526113.3545687'>https://dl.acm.org/doi/10.1145/3526113.3545687</a></p>
    <p> </p>
- guid: deephci.podbean.com/5c2a5183-bd46-390f-9651-a24c9aa3d04f
  title: Emolleia – Wearable Kinetic Flower Display for Expressing Emotions
  slug: emolleia-%e2%80%93-wearable-kinetic-flower-display-for-expressing-emotions
  published: '2024-10-05T22:30:18+09:00'
  episode: 7
  duration: 813
  audio_file: zhuang2022emolleia.mp3
  audio_length: 3254252
  audio_type: audio/mpeg
  image: episode7_3u6cs4.jpg
  description: |-
    <p>What we wear (our clothes and wearable accessories) can represent our mood at the moment. We developed Emolleia to explore how to make aesthetic wears more expressive to become a novel form of non-verbal communication to express our emotional feelings. Emolleia is an open wearable kinetic display in form of three 3D printed flowers that can dynamically open and close at different speeds. With our open-source platform, users can define their own animated motions. In this paper, we described the prototype design, hardware considerations, and user surveys (n=50) to evaluate the expressiveness of 8 pre-defined animated motions of Emolleia. Our initial results showed animated motions are feasible to communicate different emotional feelings especially at the valence and arousal dimensions. Based on the findings, we mapped eight pre-defined animated motions to the reported, user-perceived valence, arousal and dominance and discussed possible directions for future work.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3490149.3505581'>https://dl.acm.org/doi/10.1145/3490149.3505581</a></p>
- guid: deephci.podbean.com/9c062766-bf2c-38dc-9b07-bd7dbcdbef0b
  title: “I am both here and there” Parallel Control of Multiple Robotic Avatars by Disabled Workers in
    a Café
  slug: i-am-both-here-and-there-parallel-control-of-multiple-robotic-avatars-by-disabled-workers-in-a-cafe
  published: '2024-10-04T17:23:30+09:00'
  episode: 6
  duration: 371
  audio_file: barbareschi2023both.mp3
  audio_length: 1484492
  audio_type: audio/mpeg
  image: episode6_bryp3a.jpg
  description: |-
    <p>Robotic avatars can help disabled people extend their reach in interacting with the world. Technological advances make it possible for individuals to embody multiple avatars simultaneously. However, existing studies have been limited to laboratory conditions and did not involve disabled participants. In this paper, we present a real-world implementation of a parallel control system allowing disabled workers in a café to embody multiple robotic avatars at the same time to carry out different tasks. Our data corpus comprises semi-structured interviews with workers, customer surveys, and videos of café operations. Results indicate that the system increases workers’ agency, enabling them to better manage customer journeys. Parallel embodiment and transitions between avatars create multiple interaction loops where the links between disabled workers and customers remain consistent, but the intermediary avatar changes. Based on our observations, we theorize that disabled individuals possess specific competencies that increase their ability to manage multiple avatar bodies.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3544548.3581124'>https://dl.acm.org/doi/10.1145/3544548.3581124</a></p>
- guid: deephci.podbean.com/c38bad2a-aa6a-3456-b112-321cb7467dfc
  title: Movement Quality Visualization for Wheelchair Dance
  slug: movement-quality-visualization-for-wheelchair-dance
  published: '2024-10-04T14:56:21+09:00'
  episode: 5
  duration: 779
  audio_file: xie2023movement.mp3
  audio_length: 3118028
  audio_type: audio/mpeg
  image: episode5_yf6f6t.jpg
  description: |-
    <p>Wheelchair dance is an important form of disability art that is still subject to significant levels of ableism and art exclusion. Wheelchair dancers face challenges finding teachers and choreographers who can accommodate their needs, documenting and sharing choreographies that suit their body shapes and their assistive technologies. In turn, this hinders their ability to share creative expressions. Accessible resources and communication tools could help address these challenges. The goal of this research is the development of a visualization system grounded on Laban Movement Analysis (LMA) that notates movement quality while opening new horizons on perceptions of disabled bodies and the artistic legitimacy of wheelchair dance. The system uses video to identify the body landmarks of the dancer and wheelchair and extracts key features to create visualizations of expressive qualities from LMA basic effort. The current evaluation includes a pilot study with the general public and an online questionnaire targeting professionals to gain feedback supporting practical implementation and real-world deployment. Results from the general public evaluation showed that the visualization was effective in conveying basic effort movement qualities even to a novice audience. Expert consulted via questionnaire stated that the tool could be employed for reflective evaluation, as well as performance augmentation. The LMA visualization tool can support the artistic legitimization of wheelchair dancing through education, communication, performance, and documentation.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3597628'>https://dl.acm.org/doi/10.1145/3597628</a></p>
- guid: deephci.podbean.com/6d822958-3bb4-38e6-8889-60c4149d522b
  title: 'Innermost Echoes: Integrating Real-Time Physiology into Live Music Performances'
  slug: innermost-echoes-integrating-real-time-physiology-into-live-music-performances
  published: '2024-10-04T13:07:26+09:00'
  episode: 4
  duration: 606
  audio_file: hynds2024innermost.mp3
  audio_length: 2428172
  audio_type: audio/mpeg
  image: episode4_4ny3ej.jpg
  description: |-
    <p>In this paper, we propose a method for utilizing musical artifacts and physiological data as a means for creating a new form of live music experience that is rooted in the physiology of the performers and audience members. By utilizing physiological data (namely Electrodermal Activity (EDA) and Heart Rate Variability (HRV)) and applying this data to musical artifacts including a robotic koto (a traditional 13-string Japanese instrument fitted with solenoids and linear actuators), a Eurorack synthesizer, and Max/MSP software, we aim to develop a new form of semi-improvisational and significantly indeterminate performance practice. It has since evolved into a multi-modal methodology which honors improvisational performance practices and utilizes physiological data which offers both performers and audiences an ever-changing and intimate experience.<br>
    In our first exploratory phase, we focused on the development of a means for controlling a bespoke robotic koto in conjunction with a Eurorack synthesizer system and Max/MSP software for controlling the incoming data. We integrated a reliance on physiological data to infuse a more directly human elements into this artifact system. This allows a significant portion of the decision-making to be directly controlled by the incoming physiological data in real-time, thereby affording a sense of performativity within this non-living system. Our aim is to continue the development of this method to strike a novel balance between intentionality and impromptu performative results.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3623509.3633356'>https://dl.acm.org/doi/10.1145/3623509.3633356</a></p>
    <p> </p>
