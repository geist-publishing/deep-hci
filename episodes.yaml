- guid: deep-hci.org/14d6ba2d-3c9b-4324-8c78-6e60b4cc4f37
  title: 'IEEE VR 2025 Haptic Dance: Automatic Generation of Haptic Motion Effects Expressing Human Dance'
  slug: ieee-vr-2025-haptic-dance-automatic-generation-of-haptic-motion-effects-expressing-human-d
  published: '2026-01-28T23:00:00+00:00'
  episode: 72
  duration: 915
  audio_file: Feeling_the_Dancer_Haptic_Motion_Algorithm.m4a
  audio_length: 29479872
  audio_type: audio/x-m4a
  image: 069466369875a557a400b341fa814ccd64b2d3976f6ca8844c732146ee567ace.jpg
  description: |-
    <p>Watching a dance performance engages your eyes and ears—but what if you could also feel the dancer's movements? This paper presents algorithms that automatically convert motion capture data from human dance into haptic feedback, letting viewers physically experience the performer's movements through vibrotactile devices. The approach cleverly separates external movements (the dancer traveling through space) from internal movements (limb gestures and body rotations), processing each optimally for haptic rendering. Internal movements are decomposed into segments to maximize clarity and expressiveness, then all components are merged with appropriate scaling and weights. The result is a system that can take any dance motion capture and automatically generate compelling haptic effects—no manual authoring required. This opens new possibilities for immersive dance experiences in VR and beyond.</p>

    <p>Jaehyeok Ahn and Seungmoon Choi. 2025. Automatic Generation of Haptic Motion Effects Expressing Human Dance. In 2025 IEEE Conference Virtual Reality and 3D User Interfaces (VR), Saint Malo, France. IEEE. <a href="https://doi.org/10.1109/VR59515.2025.00058">https://doi.org/10.1109/VR59515.2025.00058</a></p>
