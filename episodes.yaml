  title: Detecting an Offset-Adjusted Similarity Score based on Duchenne Smiles
  slug: detecting-an-offset-adjusted-similarity-score-based-on-duchenne-smiles
  published: '2024-10-03T22:41:46+09:00'
  episode: 2
  duration: 529
  audio_file: henneberg2023detecting.mp3
  audio_length: 2116460
  audio_type: audio/mpeg
  image: episode2_evkdgy.jpg
  description: |-
    <p>Detecting interpersonal synchrony in the wild through ubiquitous wearable sensing invites promising new social insights as well as the possibility of new interactions between humans-humans and humans-agents. We present the Offset-Adjusted SImilarity Score (OASIS), a real-time method of detecting similarity which we show working on visual detection of Duchenne smile between a pair of users. We conduct a user study survey (N = 27) to measure a user-based interoperability score on smile similarity and compare the user score with OASIS as well as the rolling window Pearson correlation and the Dynamic Time Warping (DTW) method. Ultimately, our results indicate that our algorithm has intrinsic qualities comparable to the user score and measures well to the statistical correlation methods. It takes the temporal offset between the input signals into account with the added benefit of being an algorithm which can be adapted to run in real-time will less computational intensity than traditional time series correlation methods.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3544549.3585709'>https://dl.acm.org/doi/10.1145/3544549.3585709</a></p>
