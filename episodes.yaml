- guid: deephci.podbean.com/9240eb6a-d826-5c10-9d19-6f70f65cd721
  title: 'AHs 2025 texTENG: Fabricating Wearable Textile-Based Triboelectric Nanogenerators'
  slug: ahs-2025-texteng-fabricating-wearable-textile-based-triboelectric-nanogenerators
  published: '2026-03-06T09:37:32+09:00'
  episode: 70
  duration: 701
  audio_file: Making_Clothes_Power_Triboelectric_Nanogenerators.m4a
  audio_length: 22583764
  audio_type: audio/x-m4a
  image: 76c6d08b0a38ed7c164421a3d8d92c20ef4f1d0a131fa56e3eb1b1e658628795.jpg
  description: |-
    <p>What if your clothes could power your wearable devices? texTENG introduces a maker-friendly framework for creating textile-based triboelectric nanogenerators (TENGs)—fabrics that harvest energy from everyday human motion like walking, arm swings, or even breathing. While TENGs have shown promise for sustainable wearable power, adoption has been slow due to hard-to-find materials and complex fabrication. texTENG solves this with accessible techniques using common textiles and conductive threads that makers can replicate. The system demonstrates versatile applications: from self-powered touch sensors that detect gestures without batteries, to energy-harvesting patches that can charge small devices. Technical evaluations confirm the devices can reliably detect touch input and store harvested energy efficiently. This work opens the door for HCI researchers and makers to explore battery-free wearable computing.</p>

    <p>Ritik Batra, Narjes Pourjafarian, Samantha Chang, Margaret Tsai, Jacob Revelo, and Cindy Hsin-Liu Kao. 2025. texTENG: Fabricating Wearable Textile-Based Triboelectric Nanogenerators. In Augmented Humans International Conference 2025 (AHs '25). ACM, New York, NY, USA. <a href='https://doi.org/10.1145/3745900.3746071'>https://doi.org/10.1145/3745900.3746071</a></p>
- guid: deep-hci.org/6e03f967-ead6-44a8-a6f2-f54dede3c340
  title: 'IEEE VR 2025 Blind VR: Comparing Vibrotactile and Skin-Stretch Haptic Feedback for Conveying
    Spatial Information to Blind VR Users'
  slug: ieee-vr-2025-blind-vr-comparing-vibrotactile-and-skin-stretch-haptic-feedback-for-conveyin
  published: '2026-02-12T23:00:00+00:00'
  episode: 78
  duration: 855
  audio_file: Skin_Stretch_Beats_Vibration_for_Blind_VR.m4a
  audio_length: 27519694
  audio_type: audio/x-m4a
  image: blind.jpg
  description: |-
    <p>How can blind users navigate and understand virtual environments? This paper compares two haptic approaches for conveying where virtual objects are located: vibrotactile feedback (buzzing sensations) versus skin-stretch feedback (gentle pulling on the skin). The researchers tested both methods with blind participants to see which better communicated the position and movement of objects in VR space. The results show that skin-stretch feedback significantly outperformed vibration for spatial accuracy—blind users could more precisely understand where objects were and how they moved when feeling directional skin stretch rather than vibration patterns. This finding has important implications for making VR accessible, suggesting that skin-stretch devices may be more effective than the vibration motors common in today's controllers for helping blind users build mental maps of virtual spaces.</p>

    <p>Jiasheng Li, Zining Zhang, Zeyu Yan, Yuhang Zhao, and Huaishu Peng. 2025. Comparing Vibrotactile and Skin-Stretch Haptic Feedback for Conveying Spatial Information of Virtual Objects to Blind VR Users. In 2025 IEEE Conference Virtual Reality and 3D User Interfaces (VR), Saint Malo, France. IEEE. <a href="https://doi.org/10.1109/VR59515.2025.00091">https://doi.org/10.1109/VR59515.2025.00091</a></p>
