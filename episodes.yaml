- guid: deephci.podbean.com/d7fda749-6b5e-5727-b7be-25756b62fdbc
  title: 'TAFFC 2025 Micro-Expressions: Could Micro-Expressions Be Quantified? Electromyography Gives
    Affirmative Evidence'
  slug: taffc-2024-micro-expressions-could-micro-expressions-be-quantified-electromyography-gives-affirmative-evidence
  published: '2026-01-27T09:10:25+09:00'
  episode: 66
  duration: 842
  audio_file: EMG_proves_micro-expressions_are_involuntary_leaks.m4a
  audio_length: 27129624
  audio_type: audio/x-m4a
  image: micro.jpg
  description: |-
    <p>Micro-expressions are fleeting facial movements lasting just 40-200 milliseconds that are believed to reveal concealed emotions. But can these subtle expressions actually be measured objectively? This study provides the first direct electromyographic (EMG) evidence that micro-expressions are real, quantifiable muscle activations—not just visual artifacts. By placing electrodes on participants' faces while they attempted to suppress genuine emotions, researchers captured the electrical activity of facial muscles during both macro-expressions and micro-expressions. The results show that micro-expressions involve significantly smaller muscle contractions than regular expressions, explaining why they're so hard to detect visually. The findings also reveal that micro-expressions are truly involuntary "leakage"—participants couldn't fully suppress their emotional responses even when trying. This research has important implications for lie detection, clinical assessment, and understanding the fundamental nature of emotional expression.</p>

    <p>Jingting Li, Shaoyuan Lu, Yan Wang, Zizhao Dong, Su-Jing Wang, and Xiaolan Fu. 2024. Could Micro-Expressions Be Quantified? Electromyography Gives Affirmative Evidence. IEEE Transactions on Affective Computing, vol. 16, no. 4, 2024. <a href='https://doi.org/10.1109/TAFFC.2025.3575127'>https://doi.org/10.1109/TAFFC.2025.3575127</a></p>
- guid: deephci.podbean.com/00f2e5df-3b65-5849-9193-bce853d6963b
  title: 'TAFFC 2025 Music Emotion: Are We There Yet? A Brief Survey of Music Emotion Prediction Datasets,
    Models and Outstanding Challenges'
  slug: taffc-2024-music-emotion-are-we-there-yet-a-brief-survey-of-music-emotion-prediction-datasets-models-and-outstanding-challenges
  published: '2026-01-20T21:00:48+09:00'
  episode: 64
  duration: 697
  audio_file: Deep_Learning_for_Music_Emotion_Recognition.m4a
  audio_length: 22449929
  audio_type: audio/x-m4a
  image: music.jpg
  description: |-
    <p>Music has long been known to evoke powerful emotions, but can machines truly understand and predict these emotional responses? This survey paper takes stock of the field of music emotion recognition (MER), examining the datasets, computational models, and persistent challenges that shape this research area. The authors review how emotion is represented—from categorical labels to dimensional models like valence-arousal—and analyze the most widely used datasets including the Million Song Dataset and MediaEval benchmarks. They trace the evolution from traditional machine learning approaches using hand-crafted audio features to modern deep learning architectures. Despite significant progress, the paper identifies fundamental challenges: the subjective nature of emotional responses to music, the difficulty of obtaining reliable ground truth labels, and the gap between controlled laboratory studies and real-world listening contexts.</p>

    <p>Jaeyong Kang and Dorien Herremans. 2024. Are We There Yet? A Brief Survey of Music Emotion Prediction Datasets, Models and Outstanding Challenges. IEEE Transactions on Affective Computing, vol. 16, no. 4, 2024. <a href='https://doi.org/10.1109/TAFFC.2025.3583505'>https://doi.org/10.1109/TAFFC.2025.3583505</a></p>
- guid: deep-hci.org/4c81586f-80d0-41d6-8ec0-02a3e2bcad50
  title: 'MUC 2025 MindSpace: Improving Relaxation Break and Performance Using Deep Touch Pressure on
    Users’ Upper Chest Area'
  slug: muc-2025-mindspace-improving-relaxation-break-and-performance-using-deep-touch-pressure-on
  published: '2026-01-17T23:00:00+00:00'
  episode: 68
  duration: 887
  audio_file: Deep_Touch_Pressure_Restores_Focus_Quickly.m4a
  audio_length: 28558426
  audio_type: audio/x-m4a
  image: chair.jpg
  description: |-
    <p>Taking a break at work should leave you refreshed—but often it doesn't. MindSpace is a pneumatically controlled haptic device worn on the upper chest that combines two calming sensations: gentle breathing-like movements and deep touch pressure similar to a hug. In a study with 24 participants performing demanding cognitive tasks, those who used MindSpace during their breaks showed significantly faster recovery of focus compared to those who simply rested. The device simulates the comforting sensation of being held while breathing together with someone, activating the parasympathetic nervous system to reduce stress. Participants reported feeling more relaxed and ready to return to work. This research suggests that active haptic interventions during breaks could be more effective than passive rest for restoring cognitive performance.</p>

    <p>Masaki Kikuchi, Kaining Chen, Robert Panskus, Dingding Chen, Kazuki Okawa, and Kai Kunze. 2025. MindSpace: Improving Relaxation Break and Performance Using a Device Exerting Tactile Sensation of Life-like Breathing Movement with Squeeze-like Deep Touch Pressure on Users' Upper Chest Area. In Proceedings of Mensch und Computer 2025 (MUC '25). ACM, New York, NY, USA, 255-269. <a href="https://doi.org/10.1145/3743049.3743054">https://doi.org/10.1145/3743049.3743054</a></p>
