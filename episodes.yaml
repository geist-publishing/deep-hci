- guid: deephci.podbean.com/344e8c63-8b7b-52b1-9045-802f350d98f6
  title: 'UIST 2025 Imaginary Joint: Proprioceptive Feedback for Virtual Body Extensions via Skin Stretch'
  slug: uist-2025-imaginary-joint-proprioceptive-feedback-for-virtual-body-extensions-via-skin-stretch
  published: '2026-01-16T21:37:58+09:00'
  episode: 62
  duration: 823
  audio_file: Skin_Stretch_Creates_the_Imaginary_Joint.m4a
  audio_length: 26498891
  audio_type: audio/x-m4a
  image: tail.jpg
  description: |-
    <p>Virtual body extensions like wings or tails offer exciting new experiences in VR, but using them naturally—especially parts you can't see, like a tail—requires proprioceptive feedback to sense position and force without relying on vision. This paper introduces the "Imaginary Joint," a novel approach that uses skin-stretch feedback at the interface between your body and a virtual extension. A wearable device stretches and compresses skin on both sides of the waist to convey joint angle and torque from a virtual tail. The system simultaneously communicates both rotation and force by superimposing skin deformations. In controlled experiments, skin-stretch feedback significantly outperformed vibrotactile feedback in perceptual accuracy, sense of embodiment, and naturalness—with participants reporting the sensation felt remarkably like having an actual tail.</p>

    <p>Shuto Takashita, Jürgen Steimle, and Masahiko Inami. 2025. Imaginary Joint: Proprioceptive Feedback for Virtual Body Extensions via Skin Stretch. In The 38th Annual ACM Symposium on User Interface Software and Technology (UIST '25), September 28–October 01, 2025, Busan, Republic of Korea. ACM, New York, NY, USA, 15 pages. <a href='https://doi.org/10.1145/3746059.3747800'>https://doi.org/10.1145/3746059.3747800</a></p>
- guid: deephci.podbean.com/6d4e6748-5c42-51b8-8d19-caa56f089fe7
  title: 'UIST 2025 eTactileKit: An Open-Source Toolkit for Electro-Tactile Haptic Design'
  slug: uist-2025-etactilekit-an-open-source-toolkit-for-electro-tactile-haptic-design
  published: '2026-01-08T00:18:15+09:00'
  episode: 60
  duration: 803
  audio_file: Open_Source_Tool_for_Haptic_Design.m4a
  audio_length: 25848736
  audio_type: audio/x-m4a
  image: toolkit.jpg
  description: |-
    <p>Electro-tactile interfaces—which deliver tactile sensations through electrical stimulation of skin nerves—offer unique advantages like fast response times, thin flexible form factors, and the ability to simulate textures, softness, and even coldness. But designing them has been notoriously difficult, requiring deep electronics expertise and custom hardware. eTactileKit changes that. This open-source toolkit provides end-to-end support: modular hardware that scales from 8 to 128+ electrodes, design tools for creating 2D and 3D electrode layouts, a Processing-based pattern creator with visual simulation, a GUI for real-time testing and calibration, and APIs for Python and Unity. A three-week study with both novice and experienced designers showed the toolkit significantly lowered the barrier to entry while improving design workflows—enabling rapid prototyping of applications from VR haptic buttons to 3D-printed interactive toys.</p>

    <p>Praneeth Bimsara Perera, Ravindu Madhushan Pushpakumara, Hiroyuki Kajimoto, Arata Jingu, Jürgen Steimle, and Anusha Withana. 2025. eTactileKit: A Toolkit for Design Exploration and Rapid Prototyping of Electro-Tactile Interfaces. In The 38th Annual ACM Symposium on User Interface Software and Technology (UIST '25). Association for Computing Machinery, New York, NY, USA, 17 pages. <a href='https://doi.org/10.1145/3746059.3747796'>https://doi.org/10.1145/3746059.3747796</a></p>
- guid: deephci.podbean.com/26236708-d6ec-5d37-bac7-5bad5daa1635
  title: 'VRST 2025 Self-Confrontation in VR: How Seeing Yourself Shapes Motor Skill Reflection'
  slug: vrst-2025-self-confrontation-in-vr-how-seeing-yourself-shapes-motor-skill-reflection
  published: '2026-01-05T16:33:13+09:00'
  episode: 58
  duration: 866
  audio_file: Self-Confrontation_Drives_VR_Skill_Learning.m4a
  audio_length: 27882871
  audio_type: audio/x-m4a
  image: 2x2.jpg
  description: |-
    <p>What happens when you watch yourself perform in VR—and then have to critique that performance? This study explored self-reflection in motor skill learning using a Karate training task. Participants were embodied as a "trainer" avatar and asked to give verbal feedback on a "trainee"—which was either their own 3D-scanned appearance or a stranger, performing either their own recorded movements or an expert's. The results revealed a psychological "role conflict": participants felt split between being the evaluator and being evaluated. Seeing their own appearance triggered deeper, more emotional reflection, while recognizing their own movements created bodily connection even in a stranger's avatar. The findings suggest VR embodiment isn't binary but multi-faceted, with implications for training and therapy.</p>

    <p>Dennis Dietz, Samuel Benjamin Rogers, Julian Rasch, Sophia Sakel, Nadine Wagener, Andreas Martin Butz, and Matthias Hoppe. 2025. The 2×2 of Being Me and You: How the Combination of Self and Other Avatars and Movements Alters How We Reflect on Ourselves in VR. In Proceedings of the 31st ACM Symposium on Virtual Reality Software and Technology (VRST '25). Association for Computing Machinery, New York, NY, USA, 11 pages. <a href='https://doi.org/10.1145/3756884.3765986'>https://doi.org/10.1145/3756884.3765986</a></p>
- guid: deephci.podbean.com/8404ca7f-b4f2-5529-9ccc-cc2d9a448cb2
  title: AHs 2025 Pseudo-Heartbeat Feedback for Meditation Support
  slug: ahs-2025-pseudo-heartbeat-feedback-for-meditation-support
  published: '2026-01-02T20:31:06+09:00'
  episode: 54
  duration: 746
  audio_file: Why_Fake_Heartbeats_Still_Make_You_Calm.m4a
  audio_length: 24014060
  audio_type: audio/x-m4a
  image: meditation.jpg
  description: |-
    <p>Can fake heartbeat sounds trick your body into relaxing? This system generates pseudo-heartbeat audio at rates slightly slower than your actual heart rate to induce calm and support meditation. Using a contactless radar sensor to detect real heartbeats, it creates slower auditory feedback (10-30% below actual BPM). Tested with 120 participants at SIGGRAPH Asia 2024, results showed that hearing slower heartbeats made people feel their heart rate was decreasing—even when they knew the sounds were manipulated. The findings suggest potential for non-pharmacological treatment of insomnia through enhanced interoceptive awareness.</p>

    <p>Akari Shimabukuro, Seioh Ezaki, and Keiichi Zempo. 2025. Meditation Support System Utilizing Pseudo-Heartbeat Auditory Feedback to Enhance Cardiac Interoceptive Awareness. In Proceedings of the Augmented Humans International Conference 2025 (AHs '25). Association for Computing Machinery, New York, NY, USA, 4 pages. <a href='https://doi.org/10.1145/3745900.3746096'>https://doi.org/10.1145/3745900.3746096</a></p>
- guid: deephci.podbean.com/2531677b-3695-5971-8413-9e4edab3b561
  title: 'AHs 2025 Purrfect Pitch: Learning Musical Intervals through Audio-Haptic Feedback'
  slug: ahs-2025-purrfect-pitch-learning-musical-intervals-through-audio-haptic-feedback
  published: '2025-12-30T07:19:12+09:00'
  episode: 56
  duration: 815
  audio_file: Pitch_Vest_Boosts_Performance_But_Not_Skill.m4a
  audio_length: 26233577
  audio_type: audio/x-m4a
  image: purrfect.jpg
  description: |-
    <p>Learning to identify musical pitch intervals usually requires tedious rote practice. Purrfect Pitch offers a new approach: a wearable haptic vest that translates sound into touch. When users hear two musical notes, they simultaneously feel vibrations at corresponding vertical positions on their back—leveraging our natural "high/low" pitch metaphor. In a study with 18 participants, those using the audio-haptic system identified intervals 20% more accurately and 1.67 seconds faster than audio-only learners. However, the performance boost didn't persist after removing the haptic feedback, suggesting the vest enhances task performance but doesn't accelerate long-term skill acquisition.</p>

    <p>Sam Chin, Cathy Mengying Fang, Nikhil Singh, Ibrahim Ibrahim, Joe Paradiso, and Pattie Maes. 2025. Purrfect Pitch: Exploring Pitch Interval Learning through an Audio-Haptic Interface. In Proceedings of the Augmented Humans International Conference 2025 (AHs '25). Association for Computing Machinery, New York, NY, USA, 12 pages. <a href='https://doi.org/10.1145/3745900.3746079'>https://doi.org/10.1145/3745900.3746079</a></p>
- guid: deephci.podbean.com/fe94930e-b443-5bf6-9255-090c0bc1871b
  title: 'AHs 2025 GazeLLM: Multimodal LLMs incorporating Human Visual Attention'
  slug: ahs-2025-gazellm-multimodal-llms-incorporating-human-visual-attention
  published: '2025-12-27T11:28:37+09:00'
  episode: 52
  duration: 741
  audio_file: AI_efficiency_using_human_gaze_data.m4a
  audio_length: 23876605
  audio_type: audio/x-m4a
  image: eyes.jpg
  description: |-
    <p>Processing high-resolution video with AI requires massive computational resources. GazeLLM offers an elegant solution inspired by human vision: use eye-tracking to focus only on what matters. By cropping first-person video to a small region around the user's gaze point, the system reduces pixel input to just one-tenth while achieving task comprehension equal to or better than full-resolution video. User evaluations across six real-world activities—cooking, bike repair, first aid, and sports—showed that gaze-focused video produces higher quality task descriptions than both full videos and center-cropped alternatives.</p>

    <p>Jun Rekimoto. 2025. GazeLLM: Multimodal LLMs incorporating Human Visual Attention. In Proceedings of the Augmented Humans International Conference 2025 (AHs '25). Association for Computing Machinery, New York, NY, USA, 10 pages. <a href='https://doi.org/10.1145/3745900.3746075'>https://doi.org/10.1145/3745900.3746075</a></p>
- guid: deephci.podbean.com/f0c12fef-9489-5d8b-9dd9-1852a94cf205
  title: 'AHS 2025 Cuddle-Fish: Flying Robots That Are Safe, Huggable Companions'
  slug: cuddle-fish-flying-robots-that-are-safe-huggable-companions
  published: '2025-12-13T14:07:33+09:00'
  duration: 811
  audio_file: Flying_Robots_That_Are_Safe_Huggable_Companions.m4a
  audio_length: 26123762
  audio_type: audio/x-m4a
  image: episode_logo.jpg
  description: |-
    <p>Traditional quadrotor drones pose safety concerns with their spinning blades. Cuddle-Fish takes a different approach: a helium-filled soft robot with bio-inspired flapping wings that's safe enough to touch, hug, and interact with physically. In testing with 24 participants, people spontaneously engaged in affective behaviors like patting, stroking, and even hugging the robot. Users reported positive emotional responses and felt safe during interactions, with some participants touching the robot to their cheeks, demonstrating trust and comfort.</p>

    <p>Mingyang Xu, Jiayi Shao, Yulan Ju, Ximing Shen, Qingyuan Gao, Weijen Chen, Qing Zhang, Yun Suen Pai, Giulia Barbareschi, Matthias Hoppe, Kouta Minamizawa, and Kai Kunze. 2025. Cuddle-Fish: Exploring a Soft Floating Robot with Flapping Wings for Physical Interactions. In Proceedings of the Augmented Humans International Conference 2025 (AHs '25). Association for Computing Machinery, New York, NY, USA, 14 pages. <a href='https://doi.org/10.1145/3745900.3746080'>https://doi.org/10.1145/3745900.3746080</a></p>
- guid: deephci.podbean.com/4816170e-17e5-3750-bb0f-47a35f3e26bc
  title: 'UIST 2025 Kinethreads: Soft Full-Body Haptic Exosuit using Low-Cost Motor-Pulley Mechanisms'
  slug: uist-2025-kinethreads-soft-full-body-haptic-exosuit-using-low-cost-motor-pulley-mechanisms
  published: '2025-10-01T14:20:05+09:00'
  episode: 48
  duration: 906
  audio_file: Kinethreads_Unpacked_The_400_VR_Suit_That_Uses_Pulleys_and_St9m5qz.m4a
  audio_length: 29160771
  audio_type: audio/x-m4a
  image: Gemini_Generated_Image_iakaraiakaraiaka.png
  description: |-
    <p>Our bodies experience a wide variety of kinesthetic forces as we go about our daily lives, including the weight of held objects, contact with surfaces, gravitational loads, and acceleration and centripetal forces while driving, to name just a few. These forces are crucial to realism, yet simply cannot be rendered with today’s consumer haptic suits, which primarily rely on arrays of vibration actuators built into vests. Rigid exoskeletons have more kinesthetic capability to apply forces directly to users’ joints, but are generally cumbersome to wear and cost many thousands of dollars. In this work, we present Kinethreads: a new full-body haptic exosuit design built around string-based motor-pulley mechanisms, which keeps our suit lightweight (&lt;5kg), soft and flexible, quick-to-wear (&lt;30 seconds), comparatively low-cost (~$400), and yet capable of rendering expressive, distributed, and forceful (up to 120N) effects. We detail our system design, implementation, and results from a multi-part performance evaluation and user study.<br>
    <br>
    Vivian Shen and Chris Harrison. 2025. Kinethreads: Soft Full-Body Haptic Exosuit using Low-Cost Motor-Pulley Mechanisms. In Proceedings of the 38th Annual ACM Symposium on User Interface Software and Technology (UIST '25). Association for Computing Machinery, New York, NY, USA, Article 1, 1–16. <a href='https://doi.org/10.1145/3746059.3747755'>https://doi.org/10.1145/3746059.3747755</a></p>
- guid: deephci.podbean.com/8e733e33-5a15-3c52-b987-f32a05327347
  title: 'CHI 2025 A Placebo Concert: The Placebo Effect for Visualization of Physiological Audience Data
    during Experience Recreation in Virtual Reality'
  slug: chi-2025-a-placebo-concert-the-placebo-effect-for-visualization-of-physiological-audience-data-during-experience-recreation-in-virtual-reality
  published: '2025-08-20T12:01:31+09:00'
  episode: 47
  duration: 690
  audio_file: A_Placebo_Concert_The_Placebo_Effect_in_Virtual_Realityb7a3x.mp3
  audio_length: 2763692
  audio_type: audio/mpeg
  image: placebo-concert.jpg
  description: |-
    <p>Xiaru Meng, Yulan Ju, Christopher Changmok Kim, Yan He, Giulia Barbareschi, Kouta Minamizawa, Kai Kunze, and Matthias Hoppe. 2025. A Placebo Concert: The Placebo Effect for Visualization of Physiological Audience Data during Experience Recreation in Virtual Reality. In Proceedings of the 2025 CHI Conference on Human Factors in Computing Systems (CHI '25). Association for Computing Machinery, New York, NY, USA, Article 807, 1–16. https://doi.org/10.1145/3706598.3713594</p>
    <p>A core use case for Virtual Reality applications is recreating real-life scenarios for training or entertainment. Promoting physiological responses for users in VR that match those of real-life spectators can maximize engagement and contribute to more co-presence. Current research focuses on visualizations and measurements of physiological data to ensure experience accuracy. However, placebo effects are known to influence performance and self-perception in HCI studies, creating a need to investigate the effect of visualizing different types of data (real, unmatched, and fake) on user perception during event recreation in VR. We investigate these conditions through a balanced between-groups study (n=44) of uninformed and informed participants. The informed group was provided with the information that the data visualizations represented previously recorded human physiological data. Our findings reveal a placebo effect, where the informed group demonstrated enhanced engagement and co-presence. Additionally, the fake data condition in the informed group evoked a positive emotional response.</p>
    <p><a href='https://doi.org/10.1145/3706598.3713594'>https://doi.org/10.1145/3706598.3713594</a></p>
- guid: deephci.podbean.com/510821c8-9d16-3b4a-8c4b-81b94fc34296
  title: 'CHI2025 Heartbeat Resonance: Inducing Non-contact Heartbeat Sensations in the Chest'
  slug: chi2025-heartbeat-resonance-inducing-non-contact-heartbeat-sensations-in-the-chest
  published: '2025-08-08T13:57:24+09:00'
  episode: 46
  duration: 786
  audio_file: Heartbeat_Resonance_Non-Contact_Heartbeat_Sensations7ydy2.mp3
  audio_length: 3146060
  audio_type: audio/mpeg
  image: resonance.jpg
  description: |-
    <p>Perceiving and altering the sensation of internal physiological states, such as heartbeats, is key for biofeedback and interoception. Yet, wearable devices used for this purpose can feel intrusive and typically fail to deliver stimuli aligned with the heart’s location in the chest. To address this, we introduce Heartbeat Resonance, which uses low-frequency sound waves to create <em>non-contact</em> haptic sensations in the chest cavity, mimicking heartbeats. We conduct two experiments to evaluate the system’s effectiveness. The first experiment shows that the system created realistic heartbeat sensations in the chest, with 78.05 Hz being the most effective frequency. In the second experiment, we evaluate the effects of entrainment by simulating faster and slower heart rates. Participants perceived the intended changes and reported high confidence in their perceptions for +15% and -30% heart rates. This system offers a non-intrusive solution for biofeedback while creating new possibilities for immersive VR environments.</p>
    <p>Waseem Hassan, Liyue Da, Sonia Elizondo, and Kasper Hornbæk. 2025. Heartbeat Resonance: Inducing Non-contact Heartbeat Sensations in the Chest. In Proceedings of the 2025 CHI Conference on Human Factors in Computing Systems (CHI '25). Association for Computing Machinery, New York, NY, USA, Article 913, 1–22. https://doi.org/10.1145/3706598.3713959</p>
- guid: deephci.podbean.com/83b46206-b38c-398f-84dc-6f382092a257
  title: 'CHI 2025 Living Bento: Heartbeat-Driven Noodles for Enriched Dining Dynamics'
  slug: chi-2025-living-bento-heartbeat-driven-noodles-for-enriched-dining-dynamics
  published: '2025-08-01T14:08:00+09:00'
  episode: 45
  duration: 932
  audio_file: Living_Bento_Heartbeat-Driven_Noodles_for_Enriched_Dining_Dynamics95t5l.mp3
  audio_length: 3730028
  audio_type: audio/mpeg
  image: Living_Bento_Heartbeat-Driven_Noodles_for_Enriched_Dining_Dynamicsb4l1f.jpg
  description: |-
    <p>To enhance focused eating and dining socialization, previous Human-Food Interaction research has indicated that external devices can support these dining objectives and immersion. However, methods that focus on the food itself and the diners themselves have remained underdeveloped. In this study, we integrated biofeedback with food, utilizing diners’ heart rates as a source of the food’s appearance to promote focused eating and dining socialization. By employing LED lights, we dynamically displayed diners’ real-time physiological signals through the transparency of the food. Results revealed significant effects on various aspects of dining immersion, such as awareness perceptions, attractiveness, attentiveness to each bite, and emotional bonds with the food. Furthermore, to promote dining socialization, we established a “Sharing Bio-Sync Food” dining system to strengthen emotional connections between diners. Based on these findings, we developed tableware that integrates biofeedback into the culinary experience.</p>
    Weijen Chen, Qingyuan Gao, Zheng Hu, Kouta Minamizawa, and Yun Suen Pai. 2025. Living Bento: Heartbeat-Driven Noodles for Enriched Dining Dynamics. In Proceedings of the 2025 CHI Conference on Human Factors in Computing Systems (CHI '25). Association for Computing Machinery, New York, NY, USA, Article 353, 1–18. https://doi.org/10.1145/3706598.3713108
    <p> </p>
- guid: deephci.podbean.com/16280dc2-dc06-3995-ba42-90e1daa5d444
  title: 'CHI 2025 NeuResonance: Exploring Feedback Experiences for Fostering the Inter-brain Synchronization'
  slug: chi-2025-neuresonance-exploring-feedback-experiences-for-fostering-the-inter-brain-synchronization
  published: '2025-07-25T16:56:09+09:00'
  episode: 44
  duration: 1065
  audio_file: NeuResonance_Feedback_for_Inter-brain_Synchronizationapwd9.mp3
  audio_length: 4264172
  audio_type: audio/mpeg
  image: ress.jpg
  description: |-
    <p>When several individuals collaborate on a shared task, their brain activities often synchronize. This phenomenon, known as Inter-brain Synchronization (IBS), is notable for inducing prosocial outcomes such as enhanced interpersonal feelings, including closeness, trust, empathy, and more. Further strengthening the IBS with the aid of external feedback would be beneficial for scenarios where those prosocial feelings play a vital role in interpersonal communication, such as rehabilitation between a therapist and a patient, motor skill learning between a teacher and a student, and group performance art. This paper investigates whether visual, auditory, and haptic feedback of the IBS level can further enhance its intensity, offering design recommendations for feedback systems in IBS. We report findings when three different types of feedback were provided: IBS level feedback by means of on-body projection mapping, sonification using chords, and vibration bands attached to the wrist.</p>
    <p> </p>
    Jamie Ngoc Dinh, Snehesh Shrestha, You-Jin Kim, Jun Nishida, and Myungin Lee. 2025. NeuResonance: Exploring Feedback Experiences for Fostering the Inter-brain Synchronization. In Proceedings of the 2025 CHI Conference on Human Factors in Computing Systems (CHI '25). Association for Computing Machinery, New York, NY, USA, Article 363, 1–16. https://doi.org/10.1145/3706598.3713872
    <p> </p>
- guid: deephci.podbean.com/80b269ab-dbb1-3592-a606-5708683c66b9
  title: 'CHI2025 Haptic Empathy: Investigating Individual Differences in Affective Haptic Communications'
  slug: haptic-empathy-investigating-individual-differences-in-affective-haptic-communications
  published: '2025-07-14T15:46:43+09:00'
  episode: 43
  duration: 1597
  audio_file: Haptic_Empathy_Understanding_Affective_Touch_Communication60npi.mp3
  audio_length: 6389612
  audio_type: audio/mpeg
  image: haptics.jpg
  description: |-
    <p>Yulan Ju, Xiaru Meng, Harunobu Taguchi, Tamil Selvan Gunasekaran, Matthias Hoppe, Hironori Ishikawa, Yoshihiro Tanaka, Yun Suen Pai, and Kouta Minamizawa. 2025. Haptic Empathy: Investigating Individual Differences in Affective Haptic Communications. In Proceedings of the 2025 CHI Conference on Human Factors in Computing Systems (CHI '25). Association for Computing Machinery, New York, NY, USA, Article 501, 1–25. https://doi.org/10.1145/3706598.3714139</p>
    <p>Nowadays, touch remains essential for emotional conveyance and interpersonal communication as more interactions are mediated remotely. While many studies have discussed the effectiveness of using haptics to communicate emotions, incorporating affect into haptic design still faces challenges due to individual user tactile acuity and preferences. We assessed the conveying of emotions using a two-channel haptic display, emphasizing individual differences. First, 24 participants generated 187 haptic messages reflecting their immediate sentiments after watching 8 emotionally charged film clips. Afterwards, 19 participants were asked to identify emotions from haptic messages designed by themselves and others, yielding 593 samples. Our findings suggest potential links between haptic message decoding ability and emotional traits, particularly Emotional Competence (EC) and Affect Intensity Measure (AIM). Additionally, qualitative analysis revealed three strategies participants used to create touch messages: perceptive, empathetic, and metaphorical expression.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3706598.3714139'>https://dl.acm.org/doi/10.1145/3706598.3714139</a></p>
    <p> </p>
- guid: deephci.podbean.com/287e2a49-9014-333a-ba77-83df106b6d24
  title: 'TEI 2025 : Ambient Display Utilizing Anisotropy of Tatami'
  slug: ambient-display-utilizing-anisotropy-of-tatami
  published: '2025-03-30T15:25:00+09:00'
  episode: 42
  duration: 1511
  audio_file: Tatami_Ambient_Display_Anisotropic_Information_Presentation9bdfo.mp3
  audio_length: 6046988
  audio_type: audio/mpeg
  image: Screenshot_2025-03-29_at_180941aoaup.png
  description: |-
    Riku Kitamura, Kenji Yamada, Takumi Yamamoto, and Yuta Sugiura. 2025. Ambient Display Utilizing Anisotropy of Tatami. In Proceedings of the Nineteenth International Conference on Tangible, Embedded, and Embodied Interaction (TEI '25). Association for Computing Machinery, New York, NY, USA, Article 3, 1–15. https://doi.org/10.1145/3689050.3704924
    <p> </p>
    <p>Recently, digital displays such as liquid crystal displays and projectors have enabled high-resolution and high-speed information transmission. However, their artificial appearance can sometimes detract from natural environments and landscapes. In contrast, ambient displays, which transfer information to the entire physical environment, have gained attention for their ability to blend seamlessly into living spaces. This study aims to develop an ambient display that harmonizes with traditional Japanese tatami rooms by proposing an information presentation method using tatami mats. By leveraging the anisotropic properties of tatami, which change their reflective characteristics according to viewing angles and light source positions, various images and animations can be represented. We quantitatively evaluated the color change of tatami using color difference. Additionally, we created both static and dynamic displays as information presentation methods using tatami.</p>
    <p><a href='https://doi.org/10.1145/3689050.3704924'>https://doi.org/10.1145/3689050.3704924</a></p>
    <p> </p>
- guid: deephci.podbean.com/2c0686e2-8eff-3310-b453-ac50995d07ea
  title: 'DIS 2025  ELEGNT: Expressive and Functional Movement Design for Non-anthropomorphic Robot'
  slug: dis-2025-elegnt-expressive-and-functional-movement-design-for-non-anthropomorphic-robot
  published: '2025-02-20T18:19:15+09:00'
  episode: 41
  duration: 732
  audio_file: 2501.mp3
  audio_length: 2931020
  audio_type: audio/mpeg
  image: episode42.jpg
  description: |-
    <p class="p1">Hu, Yuhan, Peide Huang, Mouli Sivapurapu, and Jian Zhang. "ELEGNT: Expressive and Functional Movement Design for Non-anthropomorphic Robot." <em>arXiv preprint arXiv:2501.12493</em>(2025).</p>
    <p class="p1"><a href='https://arxiv.org/abs/2501.12493'>https://arxiv.org/abs/2501.12493</a></p>
    <p class="p1">Nonverbal behaviors such as posture, gestures, and gaze are essential for conveying internal states, both consciously and unconsciously, in human interaction. For robots to interact more naturally with humans, robot movement design should likewise integrate expressive qualities—such as intention, attention, and emotions—alongside traditional functional considerations like task fulfillment, spatial constraints, and time efficiency. In this paper, we present the design and prototyping of a lamp-like robot that explores the interplay between functional and expressive objectives in movement design. Using a research-through-design methodology, we document the hardware design process, define expressive movement primitives, and outline a set of interaction scenario storyboards. We propose a framework that incorporates both functional and expressive utilities during movement generation, and implement the robot behavior sequences in different function- and social-oriented tasks. Through a user study comparing expression-driven versus function-driven movements across six task scenarios, our findings indicate that expression-driven movements significantly enhance user engagement and perceived robot qualities. This effect is especially pronounced in social-oriented tasks.</p>
- guid: deephci.podbean.com/39aba202-50ee-3883-913c-aeaae4a02fa3
  title: ISMAR 2024 Do you read me? (E)motion Legibility of Virtual Reality Character Representations
  slug: ismar-2024-do-you-read-me-emotion-legibility-of-virtual-reality-character-representations
  published: '2025-02-07T16:49:00+09:00'
  episode: 39
  duration: 635
  audio_file: 164700a299.mp3
  audio_length: 2543468
  audio_type: audio/mpeg
  image: episode40.jpg
  description: |-
    <p>K. Brandstätter, B. J. Congdon and A. Steed, "Do you read me? (E)motion Legibility of Virtual Reality Character Representations," <em>2024 IEEE International Symposium on Mixed and Augmented Reality (ISMAR)</em>, Bellevue, WA, USA, 2024, pp. 299-308, doi: 10.1109/ISMAR62088.2024.00044.</p>
    <p> </p>
    <p>We compared the body movements of five virtual reality (VR) avatar representations in a user study (N=53) to ascertain how well these representations could convey body motions associated with different emotions: one head-and-hands representation using only tracking data, one upper-body representation using inverse kinematics (IK), and three full-body representations using IK, motioncapture, and the state-of-the-art deep-learning model AGRoL. Participants’ emotion detection accuracies were similar for the IK and AGRoL representations, highest for the full-body motion-capture representation and lowest for the head-and-hands representation. Our findings suggest that from the perspective of emotion expressivity, connected upper-body parts that provide visual continuity improve clarity, and that current techniques for algorithmically animating the lower-body are ineffective. In particular, the deep-learning technique studied did not produce more expressive results, suggesting the need for training data specifically made for social VR applications.</p>
    <p><a href='https://ieeexplore.ieee.org/document/10765392'>https://ieeexplore.ieee.org/document/10765392</a></p>
- guid: deephci.podbean.com/7390d7bd-8452-3e76-b4ae-14698bb8da01
  title: A Conversation with Thad Starner on Mobile Sign Language Recognition
  slug: a-conversation-thad-starner-on-mobile-sign-language-recognition
  published: '2025-02-07T16:36:03+09:00'
  episode: 40
  duration: 899
  audio_file: thad-cut.m4a
  audio_length: 14779337
  audio_type: audio/x-m4a
  image: episode41.jpg
  description: |-
    <p>The Oscar best picture winning movie CODA has helped introduce Deaf culture to many in the hearing community. The capital "D" in Deaf is used when referring to the Deaf culture, whereas small "d" deaf refers to the medical condition. In the Deaf community, sign language is used to communicate, and sign has a rich history in film, the arts, and education. Learning about the Deaf culture in the United States and the importance of American Sign Language in that culture has been key to choosing projects that are useful and usable for the Deaf. </p>
    <p> </p>
- guid: deephci.podbean.com/29fd913e-e37f-32d0-a63f-35c182f4a28e
  title: 'ISMAR 2024 Whirling Interface: Hand-based Motion Matching Selection for Small Target on XR Displays'
  slug: ismar-2024-whirling-interface-hand-based-motion-matching-selection-for-small-target-on-xr-displays
  published: '2025-02-05T15:58:00+09:00'
  episode: 38
  duration: 1060
  audio_file: 164700a319.mp3
  audio_length: 4240652
  audio_type: audio/mpeg
  image: episode39.jpg
  description: |-
    <p>J. Lee <em>et al</em>., "Whirling Interface: Hand-based Motion Matching Selection for Small Target on XR Displays," <em>2024 IEEE International Symposium on Mixed and Augmented Reality (ISMAR)</em>, Bellevue, WA, USA, 2024, pp. 319-328, doi: 10.1109/ISMAR62088.2024.00046.</p>
    <p>We introduce “Whirling Interface,” a selection method for XR displays using bare-hand motion matching gestures as an input technique. We extend the motion matching input method, by introducing different input states to provide visual feedback and guidance to the users. Using the wrist joint as the primary input modality, our technique reduces user fatigue and improves performance while selecting small and distant targets. In a study with 16 participants, we compared the whirling interface with a standard ray casting method using hand gestures. The results demonstrate that the Whirling Interface consistently achieves high success rates, especially for distant targets, averaging 95.58% with a completion time of 5.58 seconds. Notably, it requires a smaller camera sensing field of view of only 21.45° horizontally and 24.7° vertically. Participants reported lower workloads on distant conditions and expressed a higher preference for the Whirling Interface in general. These findings suggest that the Whirling Interface could be a useful alternative input method for XR displays with a small camera sensing FOV or when interacting with small targets.</p>
    <p><a href='https://ieeexplore.ieee.org/abstract/document/10765156'>https://ieeexplore.ieee.org/abstract/document/10765156</a></p>
- guid: deephci.podbean.com/4c79b7dc-2286-352e-9a4d-481e8b060804
  title: 'ISMAR 2024 Perceived Empathy in Mixed Reality: Assessing the Impact of Empathic Agents’ Awareness
    of User Physiological States'
  slug: ismar-2024-perceived-empathy-in-mixed-reality-assessing-the-impact-of-empathic-agents-awareness-of-user-physiological-states
  published: '2025-02-03T15:31:11+09:00'
  episode: 37
  duration: 890
  audio_file: 164700a406.mp3
  audio_length: 3562892
  audio_type: audio/mpeg
  image: episode38.jpg
  description: |-
    <p>Z. Chang <em>et al</em>., "Perceived Empathy in Mixed Reality: Assessing the Impact of Empathic Agents’ Awareness of User Physiological States," <em>2024 IEEE International Symposium on Mixed and Augmented Reality (ISMAR)</em>, Bellevue, WA, USA, 2024, pp. 406-415, doi: 10.1109/ISMAR62088.2024.00055. <a href='https://doi.org/10.1109/ISMAR62088.2024.00055'>https://doi.org/10.1109/ISMAR62088.2024.00055</a></p>
    <p>In human-agent interaction, establishing trust and a social bond with the agent is crucial to improving communication quality and performance in collaborative tasks. This paper investigates how a Mixed Reality Agent’s (MiRA) ability to acknowledge a user’s physiological state affects perceptions such as empathy, social connectedness, presence, and trust. In a within-subject study with 24 subjects, we varied the companion agent’s awareness during a mixed-reality first-person shooting game. Three agents provided feedback based on the users’ physiological states: (1) No Awareness Agent (NAA), which did not acknowledge the user’s physiological state; (2) Random Awareness Agent (RAA), offering feedback with varying accuracy; and (3) Accurate Awareness Agent (AAA), which provided consistently accurate feedback. Subjects reported higher scores on perceived empathy, social connectedness, presence, and trust with AAA compared to RAA and NAA. Interestingly, despite exceeding NAA in perception scores, RAA was the least favored as a companion. The findings and implications for the design of MiRA interfaces are discussed, along with the limitations of the study and directions for future work.</p>
    <p><a href='https://ieeexplore.ieee.org/document/10765390'>https://ieeexplore.ieee.org/document/10765390</a></p>
- guid: deephci.podbean.com/781f422a-9cec-3704-85da-53ea63f137be
  title: 'CSCW 2024: Situating Empathy in HCI/CSCW: A Scoping Review'
  slug: cscw-2024-situating-empathy-in-hcicscw-a-scoping-review
  published: '2024-12-02T16:01:22+09:00'
  episode: 36
  duration: 2416
  audio_file: 3687052-2.mp3
  audio_length: 9664268
  audio_type: audio/mpeg
  image: episode37.jpg
  description: |-
    <p>Uğur Genç and Himanshu Verma. 2024. Situating Empathy in HCI/CSCW: A Scoping Review. Proc. ACM Hum.-Comput. Interact. 8, CSCW2, Article 513 (November 2024), 37 pages. <a href='https://doi.org/10.1145/3687052'>https://doi.org/10.1145/3687052</a></p>
    <p> </p>
    <p>Empathy is considered a crucial construct within HCI and CSCW, yet our understanding of this complex concept remains fragmented and lacks consensus in existing research. In this scoping review of 121 articles from the ACM Digital Library, we synthesize the diverse perspectives on empathy and scrutinize its current conceptualization and operationalization. In particular, we examine the various interpretations and definitions of empathy, its applications, and the methodologies, findings, and trends in the field. Our analysis reveals a lack of consensus on the definitions and theoretical underpinnings of empathy, with interpretations ranging from understanding the experiences of others to an affective response to the other's situation. We observed that despite the variety of methods used to gauge empathy, the predominant approach remains self-assessed instruments, highlighting the lack of novel and rigorously established and validated measures and methods to capture the multifaceted manifestations of empathy. Furthermore, our analysis shows that previous studies have used a variety of approaches to elicit empathy, such as experiential methods and situational awareness. These approaches have demonstrated that shared stressful experiences promote community support and relief, while situational awareness promotes empathy through increased helping behavior. Finally, we discuss a) the potential and drawbacks of leveraging empathy to shape interactions and guide design practices, b) the need to find a balance between the collective focus of empathy and the (existing and dominant) focus on the individual, and c) the careful testing of empathic designs and technologies with real-world applications.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3687052'>https://dl.acm.org/doi/10.1145/3687052</a></p>
    <p> </p>
- guid: deephci.podbean.com/5b972980-d70d-3036-becf-faf49d47d1db
  title: ICMI 2024 Exploring the Alteration and Masking of Everyday Noise Sounds using Auditory Augmented
    Reality
  slug: icmi-2024-exploring-the-alteration-and-masking-of-everyday-noise-sounds-using-auditory-augmented-reality
  published: '2024-11-18T15:20:20+09:00'
  episode: 35
  duration: 869
  audio_file: 3678957-3685750.mp3
  audio_length: 3476588
  audio_type: audio/mpeg
  image: episode36.jpg
  description: |-
    <p>Isna Alfi Bustoni, Mark McGill, and Stephen Anthony Brewster. 2024. Exploring the Alteration and Masking of Everyday Noise Sounds using Auditory Augmented Reality. In Proceedings of the 26th International Conference on Multimodal Interaction (ICMI '24). Association for Computing Machinery, New York, NY, USA, 154–163. <a href='https://doi.org/10.1145/3678957.3685750'>https://doi.org/10.1145/3678957.3685750</a></p>
    <p>While noise-cancelling headphones can block out or mask environmental noise with digital sound, this costs the user situational awareness and information. With the advancement of acoustically transparent personal audio devices (e.g. headphones, open-ear audio frames), Auditory Augmented Reality (AAR), and real-time audio processing, it is feasible to preserve user situational awareness and relevant information whilst diminishing the perception of the noise. Through an online survey (n=124), this research explored users’ attitudes and preferred AAR strategy (keep the noise, make the noise more pleasant, obscure the noise, reduce the noise, remove the noise, and replace the noise) toward different types of noises from a range of categories (living beings, mechanical, and environmental) and varying degrees of relevance. It was discovered that respondents’ degrees of annoyance varied according to the kind of noise and its relevance to them. Additionally, respondents had a strong tendency to reduce irrelevant noise and retain more relevant noise. Based on our findings, we discuss how AAR can assist users in coping with noise whilst retaining relevant information through selectively suppressing or altering the noise, as appropriate.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3678957.3685750'>https://dl.acm.org/doi/10.1145/3678957.3685750</a></p>
    <p> </p>
    <p> </p>
- guid: deephci.podbean.com/92feb8d5-5446-3197-84bd-34734f0cc1aa
  title: 'ASSETS 2024: SoundHapticVR: Head-Based Spatial Haptic Feedback for Accessible Sounds in Virtual
    Reality for Deaf and Hard of Hearing Users'
  slug: assets-2024-soundhapticvr-head-based-spatial-haptic-feedback-for-accessible-sounds-in-virtual-reality-for-deaf-and-hard-of-hearing-users
  published: '2024-11-09T15:01:00+09:00'
