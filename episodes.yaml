  audio_file: 3663548-3675639.mp3
  audio_length: 3227372
  audio_type: audio/mpeg
  image: episode35.jpg
  description: |-
    <p>Pratheep Kumar Chelladurai, Ziming Li, Maximilian Weber, Tae Oh, and Roshan L Peiris. 2024. SoundHapticVR: Head-Based Spatial Haptic Feedback for Accessible Sounds in Virtual Reality for Deaf and Hard of Hearing Users. In Proceedings of the 26th International ACM SIGACCESS Conference on Computers and Accessibility (ASSETS '24). Association for Computing Machinery, New York, NY, USA, Article 31, 1–17. <a href='https://doi.org/10.1145/3663548.3675639'>https://doi.org/10.1145/3663548.3675639</a></p>
    <p>Virtual Reality (VR) systems use immersive spatial audio to convey critical information, but these audio cues are often inaccessible to Deaf or Hard-of-Hearing (DHH) individuals. To address this, we developed SoundHapticVR, a head-based haptic system that converts audio signals into haptic feedback using multi-channel acoustic haptic actuators. We evaluated SoundHapticVR through three studies: determining the maximum tactile frequency threshold on different head regions for DHH users, identifying the ideal number and arrangement of transducers for sound localization, and assessing participants’ ability to differentiate sound sources with haptic patterns. Findings indicate that tactile perception thresholds vary across head regions, necessitating consistent frequency equalization. Adding a front transducer significantly improved sound localization, and participants could correlate distinct haptic patterns with specific objects. Overall, this system has the potential to make VR applications more accessible to DHH users.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3663548.3675639'>https://dl.acm.org/doi/10.1145/3663548.3675639</a></p>
    <p> </p>
- guid: deephci.podbean.com/33a5c56a-b91c-3468-a7bb-d7e0804fa950
  title: 'ASSETS 2024: SeaHare: An omidirectional electric wheelchair integrating independent, remote
    and shared control modalities'
  slug: assets-2024-seahare-an-omidirectional-electric-wheelchair-integrating-independent-remote-and-shared-control-modalities
  published: '2024-11-09T10:33:04+09:00'
  episode: 33
  duration: 794
  audio_file: 3663548-3675657.mp3
  audio_length: 3176588
  audio_type: audio/mpeg
  image: episode34.jpg
  description: |-
    <p>Giulia Barbareschi, Ando Ryoichi, Midori Kawaguchi, Minato Takeda, and Kouta Minamizawa. 2024. SeaHare: An omidirectional electric wheelchair integrating independent, remote and shared control modalities. In Proceedings of the 26th International ACM SIGACCESS Conference on Computers and Accessibility (ASSETS '24). Association for Computing Machinery, New York, NY, USA, Article 9, 1–16. <a href='https://doi.org/10.1145/3663548.3675657'>https://doi.org/10.1145/3663548.3675657</a></p>
    <p>Depending on one’s needs electric wheelchairs can feature different interfaces and driving paradigms with control handed to the user, a remote pilot, or shared. However, these systems have generally been implemented on separate wheelchairs, making comparison difficult. We present the design of an omnidirectional electric wheelchair that can be controlled using two sensing seats detecting changes in the centre of gravity. One of the sensing seats is used by the person on the wheelchair, whereas the other is used as a remote control by a second person. We explore the use of the wheelchair using different control paradigms (independent, remote, and shared) from both the wheelchair and the remote control seat with 5 dyads and 1 triad of participants, including wheelchair users and non. Results highlight key advantages and disadvantages of the SeaHare in different paradigms, with participants’ perceptions affected by their skills and lived experiences, and reflections on how different control modes might suit different scenarios.<br>
    <a href='https://dl.acm.org/doi/10.1145/3663548.3675657'>https://dl.acm.org/doi/10.1145/3663548.3675657</a></p>
- guid: deephci.podbean.com/a6327bfa-ca67-3c15-8366-a59aef6f02be
  title: 'ASSETS 2024: Brain Body Jockey project: Transcending Bodily Limitations in Live Performance
    via Human Augmentation'
  slug: assets-2024-brain-body-jockey-project-transcending-bodily-limitations-in-live-performance-via-human-augmentation
  published: '2024-11-07T16:51:16+09:00'
  episode: 32
  duration: 854
  audio_file: 3663548-3675621.mp3
  audio_length: 3419180
  audio_type: audio/mpeg
  image: episode33.jpg
  description: |-
    <p>Giulia Barbareschi, Songchen Zhou, Ando Ryoichi, Midori Kawaguchi, Mark Armstrong, Mikito Ogino, Shunsuke Aoiki, Eisaku Ohta, Harunobu Taguchi, Youichi Kamiyama, Masatane Muto, Kentaro Yoshifuji, and Kouta Minamizawa. 2024. Brain Body Jockey project: Transcending Bodily Limitations in Live Performance via Human Augmentation. In Proceedings of the 26th International ACM SIGACCESS Conference on Computers and Accessibility (ASSETS '24). Association for Computing Machinery, New York, NY, USA, Article 18, 1–14. <a href='https://doi.org/10.1145/3663548.3675621'>https://doi.org/10.1145/3663548.3675621</a></p>
    <p>Musicians with significant mobility limitations, face unique challenges in being able to use their bodies to interact with fans during live performances. In this paper we present the results of a collaboration between a professional DJ with advanced Amyotrophic Lateral Sclerosis and a group of technologists and researchers culminating in two public live performances leveraging human augmentation technologies to enhance the artist’s stage presence. Our system combines Brain Machine Interface, and accelerometer based trigger, to select pre-programmed moves performed by robotic arms during a live event, as well as for facilitating direct physical interaction during a “Meet the DJ” event. Our evaluation includes ethnographic observations and interviews with the artist and members of the audience. Results show that the system allowed artist and audience to feel a sense of unity, expanded the imagination of creative possibilities, and challenged conventional perceptions of disability in the arts and beyond.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3663548.3675621'>https://dl.acm.org/doi/10.1145/3663548.3675621</a></p>
    <p> </p>
- guid: deephci.podbean.com/87955fd4-f112-3b12-95a2-56ebec4b1085
  title: 'ISMAR 2024: Searching Across Realities: Investigating ERPs and Eye-Tracking Correlates of Visual
    Search in Mixed Reality'
  slug: ismar-2024-searching-across-realities-investigating-erps-and-eye-tracking-correlates-of-visual-search-in-mixed-reality
  published: '2024-11-07T16:17:20+09:00'
  episode: 31
  duration: 937
  audio_file: 10-1109-TVCG-2024-3456172.mp3
  audio_length: 3751340
  audio_type: audio/mpeg
  image: episode32.jpg
  description: |-
    <p>F. Chiossi, I. Trautmannsheimer, C. Ou, U. Gruenefeld and S. Mayer, "Searching Across Realities: Investigating ERPs and Eye-Tracking Correlates of Visual Search in Mixed Reality," in IEEE Transactions on Visualization and Computer Graphics, vol. 30, no. 11, pp. 6997-7007, Nov. 2024, doi: 10.1109/TVCG.2024.3456172.</p>
    <p>Mixed Reality allows us to integrate virtual and physical content into users' environments seamlessly. Yet, how this fusion affects perceptual and cognitive resources and our ability to find virtual or physical objects remains uncertain. Displaying virtual and physical information simultaneously might lead to divided attention and increased visual complexity, impacting users' visual processing, performance, and workload. In a visual search task, we asked participants to locate virtual and physical objects in Augmented Reality and Augmented Virtuality to understand the effects on performance. We evaluated search efficiency and attention allocation for virtual and physical objects using event-related potentials, fixation and saccade metrics, and behavioral measures. We found that users were more efficient in identifying objects in Augmented Virtuality, while virtual objects gained saliency in Augmented Virtuality. This suggests that visual fidelity might increase the perceptual load of the scene. Reduced amplitude in distractor positivity ERP, and fixation patterns supported improved distractor suppression and search efficiency in Augmented Virtuality. We discuss design implications for mixed reality adaptive systems based on physiological inputs for interaction.</p>
    <p><a href='https://ieeexplore.ieee.org/document/10679197'>https://ieeexplore.ieee.org/document/10679197</a></p>
    <p> </p>
- guid: deephci.podbean.com/238b9ccf-9748-3ce0-b3c8-c74c622eabf9
  title: 'ISMAR 2024: “As if it were my own hand”: inducing the rubber hand illusion through virtual reality
    for motor imagery enhancement'
  slug: ismar-2024-as-if-it-were-my-own-hand-inducing-the-rubber-hand-illusion-through-virtual-reality-for-motor-imagery-enhancement
  published: '2024-11-04T20:52:53+09:00'
  episode: 30
  duration: 1166
  audio_file: 10-1109-TVCG-2024-3456147.mp3
  audio_length: 4667372
  audio_type: audio/mpeg
  image: episode31.jpg
  description: |-
    <p>S. Cheng, Y. Liu, Y. Gao and Z. Dong, "“As if it were my own hand”: inducing the rubber hand illusion through virtual reality for motor imagery enhancement," in <em>IEEE Transactions on Visualization and Computer Graphics</em>, vol. 30, no. 11, pp. 7086-7096, Nov. 2024, doi: <a href='https://doi.org/10.1109/tvcg.2024.3456147'>       10.1109/TVCG.2024.3456147 </a></p>
    <p>Brain-computer interfaces (BCI) are widely used in the field of disability assistance and rehabilitation, and virtual reality (VR) is increasingly used for visual guidance of BCI-MI (motor imagery). Therefore, how to improve the quality of electroencephalogram (EEG) signals for MI in VR has emerged as a critical issue. People can perform MI more easily when they visualize the hand used for visual guidance as their own, and the Rubber Hand Illusion (RHI) can increase people's ownership of the prosthetic hand. We proposed to induce RHI in VR to enhance participants' MI ability and designed five methods of inducing RHI, namely active movement, haptic stimulation, passive movement, active movement mixed with haptic stimulation, and passive movement mixed with haptic stimulation, respectively. We constructed a first-person training scenario to train participants' MI ability through the five induction methods. The experimental results showed that through the training, the participants' feeling of ownership of the virtual hand in VR was enhanced, and the MI ability was improved. Among them, the method of mixing active movement and tactile stimulation proved to have a good effect on enhancing MI. Finally, we developed a BCI system in VR utilizing the above training method, and the performance of the participants improved after the training. This also suggests that our proposed method is promising for future application in BCI rehabilitation systems.</p>
    <p><a href='https://ieeexplore.ieee.org/document/10669780'>https://ieeexplore.ieee.org/document/10669780</a></p>
- guid: deephci.podbean.com/9f94db32-09d1-3f34-a849-f45b7363379d
  title: 'ISMAR 2024: Filtering on the Go: Effect of Filters on Gaze Pointing Accuracy During Physical
    Locomotion in Extended Reality'
  slug: ismar-2024-filtering-on-the-go-effect-of-filters-on-gaze-pointing-accuracy-during-physical-locomotion-in-extended-reality
  published: '2024-11-02T01:20:00+09:00'
  episode: 29
  duration: 1226
  audio_file: 10-1109-TVCG-2024-3456153.mp3
  audio_length: 4904300
  audio_type: audio/mpeg
  image: episode30_9iczgm.jpg
  description: |-
    <p>Pavel Manakhov, Ludwig Sidenmark, Ken Pfeuffer, and Hans Gellersen. 2024. Filtering on the Go: Effect of Filters on Gaze Pointing Accuracy During Physical Locomotion in Extended Reality. IEEE Transactions on Visualization and Computer Graphics 30, 11 (Nov. 2024), 7234–7244. https://doi.org/10.1109/TVCG.2024.3456153</p>
    <p>Eye tracking filters have been shown to improve accuracy of gaze estimation and input for stationary settings. However, their effectiveness during physical movement remains underexplored. In this work, we compare common online filters in the context of physical locomotion in extended reality and propose alterations to improve them for on-the-go settings. We conducted a computational experiment where we simulate performance of the online filters using data on participants attending visual targets located in world-, path-, and two head-based reference frames while standing, walking, and jogging. Our results provide insights into the filters' effectiveness and factors that affect it, such as the amount of noise caused by locomotion and differences in compensatory eye movements, and demonstrate that filters with saccade detection prove most useful for on-the-go settings. We discuss the implications of our findings and conclude with guidance on gaze data filtering for interaction in extended reality.</p>
    <p><a href='https://ieeexplore.ieee.org/document/10672561'>https://ieeexplore.ieee.org/document/10672561</a></p>
- guid: deephci.podbean.com/64fcbff8-01c0-3f6d-9932-f709324aa71d
  title: 'UIST 2024 Best Paper: What''s the Game, then? Opportunities and Challenges for Runtime Behavior
    Generation'
  slug: uist-2024-best-paper-whats-the-game-then-opportunities-and-challenges-for-runtime-behavior-generation
  published: '2024-10-28T02:56:00+09:00'
  episode: 28
  duration: 893
  audio_file: bp-3654777-3676358.mp3
  audio_length: 3574988
  audio_type: audio/mpeg
  image: episode29_9n9mtg.jpg
  description: |-
    <p>Nicholas Jennings, Han Wang, Isabel Li, James Smith, and Bjoern Hartmann. 2024. What's the Game, then? Opportunities and Challenges for Runtime Behavior Generation. In Proceedings of the 37th Annual ACM Symposium on User Interface Software and Technology (UIST '24). Association for Computing Machinery, New York, NY, USA, Article 106, 1–13. <a href='https://doi.org/10.1145/3654777.3676358'>https://doi.org/10.1145/3654777.3676358</a></p>
    <p> </p>
    <p>Procedural content generation (PCG), the process of algorithmically creating game components instead of manually, has been a common tool of game development for decades. Recent advances in large language models (LLMs) enable the generation of game behaviors based on player input at runtime. Such code generation brings with it the possibility of entirely new gameplay interactions that may be difficult to integrate with typical game development workflows. We explore these implications through GROMIT, a novel LLM-based runtime behavior generation system for Unity. When triggered by a player action, GROMIT generates a relevant behavior which is compiled without developer intervention and incorporated into the game. We create three demonstration scenarios with GROMIT to investigate how such a technology might be used in game development. In a system evaluation we find that our implementation is able to produce behaviors that result in significant downstream impacts to gameplay. We then conduct an interview study with n=13 game developers using GROMIT as a probe to elicit their current opinion on runtime behavior generation tools, and enumerate the specific themes curtailing the wider use of such tools. We find that the main themes of concern are quality considerations, community expectations, and fit with developer workflows, and that several of the subthemes are unique to runtime behavior generation specifically. We outline a future work agenda to address these concerns, including the need for additional guardrail systems for behavior generation.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3654777.3676358'>https://dl.acm.org/doi/10.1145/3654777.3676358</a></p>
- guid: deephci.podbean.com/b1030347-6cf7-33fe-91d5-33ccd4b52ddc
  title: 'UIST 2024 Honorable Mention: Can a Smartwatch Move Your Fingers? Compact and Practical Electrical
    Muscle Stimulation in a Smartwatch'
  slug: uist-2024-honorable-mention-can-a-smartwatch-move-your-fingers-compact-and-practical-electrical-muscle-stimulation-in-a-smartwatch
  published: '2024-10-25T04:54:00+09:00'
  episode: 26
  duration: 720
  audio_file: hm-3654777-3676373.mp3
  audio_length: 2880908
  audio_type: audio/mpeg
  image: episode27_6b84ne.jpg
  description: |-
    <p>Akifumi Takahashi, Yudai Tanaka, Archit Tamhane, Alan Shen, Shan-Yuan Teng, and Pedro Lopes. 2024. Can a Smartwatch Move Your Fingers? Compact and Practical Electrical Muscle Stimulation in a Smartwatch. In Proceedings of the 37th Annual ACM Symposium on User Interface Software and Technology (UIST '24). Association for Computing Machinery, New York, NY, USA, Article 2, 1–15. <a href='https://doi.org/10.1145/3654777.3676373'>https://doi.org/10.1145/3654777.3676373</a></p>
    <p>Smartwatches gained popularity in the mainstream, making them into today’s de-facto wearables. Despite advancements in sensing, haptics on smartwatches is still restricted to tactile feedback (e.g., vibration). Most smartwatch-sized actuators cannot render strong force-feedback. Simultaneously, electrical muscle stimulation (EMS) promises compact force-feedback but, to actuate fingers requires users to wear many electrodes on their forearms. While forearm electrodes provide good accuracy, they detract EMS from being a practical force-feedback interface. To address this, we propose moving the electrodes to the wrist—conveniently packing them in the backside of a smartwatch. In our first study, we found that by cross-sectionally stimulating the wrist in 1,728 trials, we can actuate thumb extension, index extension &amp; flexion, middle flexion, pinky flexion, and wrist flexion. Following, we engineered a compact EMS that integrates directly into a smartwatch’s wristband (with a custom stimulator, electrodes, demultiplexers, and communication). In our second study, we found that participants could calibrate our device by themselves &lt;Formula format="inline"&gt;&lt;TexMath&gt;&lt;?TeX $\sim 50 \%$?&gt;&lt;/TexMath&gt;&lt;AltText&gt;Math 1&lt;/AltText&gt;&lt;File name="uist24-51-inline1" type="svg"/&gt;&lt;/Formula&gt; faster than with conventional EMS. Furthermore, all participants preferred the experience of this device, especially for its social acceptability &amp; practicality. We believe that our approach opens new applications for smartwatch-based interactions, such as haptic assistance during everyday tasks.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3654777.3676373'>https://dl.acm.org/doi/10.1145/3654777.3676373</a></p>
- guid: deephci.podbean.com/7034922e-0eda-3c14-995f-fe9c025a57db
  title: 'UIST 2024 Honorable Mention: Wheeler: A Three-Wheeled Input Device for Usable, Eficient, and
    Versatile Non-Visual Interaction'
  slug: uist-2024-honorable-mention-wheeler-a-three-wheeled-input-device-for-usable-eficient-and-versatile-non-visual-interaction
  published: '2024-10-25T04:44:00+09:00'
  episode: 25
  duration: 719
  audio_file: hm-3654777-3676396.mp3
  audio_length: 2877260
  audio_type: audio/mpeg
  image: episode26_5wbs5n.jpg
  description: |-
    <p>Md Touhidul Islam, Noushad Sojib, Imran Kabir, Ashiqur Rahman Amit, Mohammad Ruhul Amin, and Syed Masum Billah. 2024. Wheeler: A Three-Wheeled Input Device for Usable, Efficient, and Versatile Non-Visual Interaction. In Proceedings of the 37th Annual ACM Symposium on User Interface Software and Technology (UIST '24). Association for Computing Machinery, New York, NY, USA, Article 31, 1–20.  <a href='https://doi.org/10.1145/3654777.3676396'>https://doi.org/10.1145/3654777.3676396</a></p>
    <p>Blind users rely on keyboards and assistive technologies like screen readers to interact with user interface (UI) elements. In modern applications with complex UI hierarchies, navigating to different UI elements poses a significant accessibility challenge. Users must listen to screen reader audio descriptions and press relevant keyboard keys one at a time. This paper introduces Wheeler, a novel three-wheeled, mouse-shaped stationary input device, to address this issue. Informed by participatory sessions, Wheeler enables blind users to navigate up to three hierarchical levels in an app independently using three wheels instead of navigating just one level at a time using a keyboard. The three wheels also offer versatility, allowing users to repurpose them for other tasks, such as 2D cursor manipulation. A study with 12 blind users indicates a significant reduction (40%) in navigation time compared to using a keyboard. Further, a diary study with our blind co-author highlights Wheeler’s additional benefits, such as accessing UI elements with partial metadata and facilitating mixed-ability collaboration.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3654777.3676396'>https://dl.acm.org/doi/10.1145/3654777.3676396</a></p>
    <p> </p>
- guid: deephci.podbean.com/660bb9fe-e68a-3716-9e35-285d59e55df9
  title: 'UIST 2024 Honorable Mention: BlendScape: Enabling End-User Customization of Video-Conferencing
    Environments through Generative AI'
  slug: uist-2024-honorable-mention-blendscape-enabling-end-user-customization-of-video-conferencing-environments-through-generative-ai
  published: '2024-10-25T01:02:00+09:00'
  episode: 27
  duration: 920
  audio_file: hm-3654777-3676326.mp3
  audio_length: 3681068
  audio_type: audio/mpeg
  image: episode28_vis4j3.jpg
  description: |-
    <p>Shwetha Rajaram, Nels Numan, Balasaravanan Thoravi Kumaravel, Nicolai Marquardt, and Andrew D Wilson. 2024. BlendScape: Enabling End-User Customization of Video-Conferencing Environments through Generative AI. In Proceedings of the 37th Annual ACM Symposium on User Interface Software and Technology (UIST '24). Association for Computing Machinery, New York, NY, USA, Article 40, 1–19. <a href='https://doi.org/10.1145/3654777.3676326'>https://doi.org/10.1145/3654777.3676326</a></p>
    <p>Today’s video-conferencing tools support a rich range of professional and social activities, but their generic meeting environments cannot be dynamically adapted to align with distributed collaborators’ needs. To enable end-user customization, we developed BlendScape, a rendering and composition system for video-conferencing participants to tailor environments to their meeting context by leveraging AI image generation techniques. BlendScape supports flexible representations of task spaces by blending users’ physical or digital backgrounds into unified environments and implements multimodal interaction techniques to steer the generation. Through an exploratory study with 15 end-users, we investigated whether and how they would find value in using generative AI to customize video-conferencing environments. Participants envisioned using a system like BlendScape to facilitate collaborative activities in the future, but required further controls to mitigate distracting or unrealistic visual elements. We implemented scenarios to demonstrate BlendScape’s expressiveness for supporting environment design strategies from prior work and propose composition techniques to improve the quality of environments.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3654777.3676326'>https://dl.acm.org/doi/10.1145/3654777.3676326</a></p>
- guid: deephci.podbean.com/c9e71e94-8644-355e-8002-8978547f1370
  title: 'UIST 2024: DexteriSync: A Hand Thermal I/O Exoskeleton for Morphing Finger Dexterity Experience'
  slug: uist-2024-dexterisync-a-hand-thermal-io-exoskeleton-for-morphing-finger-dexterity-experience
  published: '2024-10-24T06:40:00+09:00'
  episode: 24
  duration: 839
  audio_file: 3654777-3676422.mp3
  audio_length: 3357740
  audio_type: audio/mpeg
  image: episode25_ybtn5b.jpg
  description: |-
    <p>Ximing Shen, Youichi Kamiyama, Kouta Minamizawa, and Jun Nishida. 2024. DexteriSync: A Hand Thermal I/O Exoskeleton for Morphing Finger Dexterity Experience. In Proceedings of the 37th Annual ACM Symposium on User Interface Software and Technology (UIST '24). Association for Computing Machinery, New York, NY, USA, Article 102, 1–12. <a href='https://doi.org/10.1145/3654777.3676422'>https://doi.org/10.1145/3654777.3676422</a></p>
    <p> </p>
    <p>Skin temperature is an important physiological factor for human hand dexterity. Leveraging this feature, we engineered an exoskeleton, called DexteriSync, that can dynamically adjust the user’s finger dexterity and induce different thermal perceptions by modulating finger skin temperature. This exoskeleton comprises flexible silicone-copper tube segments, 3D-printed finger sockets, a 3D-printed palm base, a pump system, and a water temperature control with a storage unit. By realising an embodied experience of compromised dexterity, DexteriSync can help product designers understand the lived experience of compromised hand dexterity, such as that of the elderly and/or neurodivergent users, when designing daily necessities for them.<br>
    We validated DexteriSync via a technical evaluation and two user studies, demonstrating that it can change skin temperature, dexterity, and thermal perception. An exploratory session with design students and an autistic compromised dexterity individual, demonstrated the exoskeleton provided a more realistic experience compared to video education, and allowed them to gain higher confidence in their designs. The results advocated for the efficacy of experiencing embodied compromised finger dexterity, which can promote an understanding of the related physical challenges and lead to a more persuasive design for assistive tools.<br>
    <a href='https://dl.acm.org/doi/10.1145/3654777.3676422'>https://dl.acm.org/doi/10.1145/3654777.3676422</a></p>
    <p> </p>
- guid: deephci.podbean.com/d4b2255e-45fc-3429-bf8e-d88ac4ee1324
  title: 'UIST 2024: Modulating Heart Activity and Task Performance using Haptic Heartbeat Feedback: A
    Study Across Four Body Placements'
  slug: uist-2024-modulating-heart-activity-and-task-performance-using-haptic-heartbeat-feedback-a-study-across-four-body-placements
  published: '2024-10-23T13:57:33+09:00'
  episode: 23
  duration: 675
  audio_file: 3654777-3676435.mp3
  audio_length: 2703500
  audio_type: audio/mpeg
  image: episode24_ncsk89.jpg
  description: |-
    <p>Andreia Valente, Dajin Lee, Seungmoon Choi, Mark Billinghurst, and Augusto Esteves. 2024. Modulating Heart Activity and Task Performance using Haptic Heartbeat Feedback: A Study Across Four Body Placements. In Proceedings of the 37th Annual ACM Symposium on User Interface Software and Technology (UIST '24). Association for Computing Machinery, New York, NY, USA, Article 25, 1–13. <a href='https://doi.org/10.1145/3654777.3676435'>https://doi.org/10.1145/3654777.3676435</a></p>
    <p>This paper explores the impact of vibrotactile haptic feedback on heart activity when the feedback is provided at four different body locations (chest, wrist, neck, and ankle) and with two feedback rates (50 bpm and 110 bpm). A user study found that the neck placement resulted in higher heart rates and lower heart rate variability, and higher frequencies correlated with increased heart rates and decreased heart rate variability. The chest was preferred in self-reported metrics, and neck placement was perceived as less satisfying, harmonious, and immersive. This research contributes to understanding the interplay between psychological experiences and physiological responses when using haptic biofeedback resembling real body signals.</p>
    <p><a href='https://dl.acm.org/doi/10.1145/3654777.3676435'>https://dl.acm.org/doi/10.1145/3654777.3676435</a></p>
    <p> </p>
- guid: deephci.podbean.com/4339e45b-a816-340b-8ada-c6cc24fd1054
  title: 'MobileHCI 2024: Visual Noise Cancellation: Exploring Visual Discomfort and Opportunities for
